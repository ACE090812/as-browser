<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS Bank</title>
<link rel="stylesheet" href="/sdk/site.css">
<style>
    :root {
        --accent: #0f4c81; --accent-fg: #fff; --accent-2: #0e8f7e;
        --navy: #0b2e4f; --navy-fg: #e8f0f8; --nav-bg: #fff; --nav-line: #d9e0e8;
        --in: #0a7d3b; --out: #14171c; --card-shadow: 0 1px 2px rgba(11,46,79,.08), 0 6px 18px rgba(11,46,79,.06);
    }
    :root[data-theme="dark"] {
        --accent: #6db0ff; --accent-fg: #06192e; --accent-2: #46d0bd; --navy: #0a1c30; --navy-fg: #dbe7f5;
        --nav-bg: #161a21; --nav-line: #2b303a; --in: #4cd58a; --out: #f1f2f4; --card-shadow: none;
    }
    body { background: var(--surface); }
    :root[data-theme="dark"] body { background: var(--bg); }
    .hd { background: var(--navy); color: var(--navy-fg); }
    .hd .in { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.01em; cursor: pointer; color: #fff; }
    .logo svg { width: 30px; height: 30px; flex: none; }
    .logo small { display: block; font-weight: 400; font-size: 11.5px; opacity: .75; letter-spacing: 0; margin-top: -2px; }
    .hd .who { margin-left: auto; text-align: right; font-size: 13px; line-height: 1.3; }
    .hd .who b { display: block; font-size: 14px; color: #fff; }
    .hd .secure { opacity: .8; font-size: 12px; }
    .mn { background: var(--nav-bg); border-bottom: 1px solid var(--nav-line); position: sticky; top: 0; z-index: 5; }
    .mn .in { max-width: 1040px; margin: 0 auto; display: flex; overflow-x: auto; padding: 0 8px; }
    .mn button { padding: 14px 14px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; display: flex; gap: 7px; align-items: center; }
    .mn button.on { color: var(--accent); border-bottom-color: var(--accent); }
    .mn .bdg { background: #d63a2f; color: #fff; border-radius: 999px; font-size: 11.5px; min-width: 19px; height: 19px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center; }
    .pg { max-width: 1040px; margin: 0 auto; padding: 18px 16px 8px; }
    h1 { font-size: 24px; font-weight: 800; margin: 2px 0 2px; }
    h2 { font-size: 16.5px; font-weight: 800; margin: 0 0 10px; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    .panel { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--card-shadow); padding: 16px; }
    .panel + .panel { margin-top: 14px; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 720px) { .cols { grid-template-columns: 1fr; } .hd .secure { display: none; } }
    .acct .type { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .acct .nums { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
    .acct .bal { font-size: 36px; font-weight: 800; letter-spacing: -.02em; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
    .acct .bal.neg { color: var(--bad); }
    .acct .lbl { color: var(--muted); font-size: 13px; }
    .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .b { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 0 18px; border-radius: 8px; font-weight: 700; background: var(--accent); color: var(--accent-fg); }
    .b:disabled { opacity: .5; cursor: default; }
    .b.sec { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
    .b.red { background: var(--bad); color: #fff; }
    .b.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; }
    .b.block { display: flex; width: 100%; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .tile .l { color: var(--muted); font-size: 12.5px; }
    .tile .v { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .tile .v.in { color: var(--in); }
    .card3d { border-radius: 16px; aspect-ratio: 1.586; padding: 16px 18px; color: #fff; position: relative; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.22); display: flex; flex-direction: column; justify-content: space-between; max-width: 340px; margin: 0 auto; }
    .card3d::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.22), transparent 55%); pointer-events: none; }
    .card3d .top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; letter-spacing: .02em; }
    .card3d .chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #f4d98a, #c9a04a); }
    .card3d .num { font-size: 18px; letter-spacing: .18em; font-variant-numeric: tabular-nums; }
    .card3d .bot { display: flex; justify-content: space-between; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; opacity: .92; }
    .alert { display: flex; gap: 12px; align-items: center; background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600; cursor: pointer; }
    .alert.good { background: var(--good-bg); color: var(--good); cursor: default; }
    .alert.bad { background: var(--bad-bg); color: var(--bad); cursor: default; }
    .alert .g { flex: 1; }
    .tx { display: flex; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    .tx:last-child { border-bottom: 0; }
    .tx .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; flex: none; font-size: 17px; }
    .tx .ds { flex: 1; min-width: 0; }
    .tx .ds b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx .ds small { color: var(--muted); font-size: 12.5px; }
    .tx .am { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tx .am.p { color: var(--in); }
    .dayh { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; padding: 14px 2px 4px; }
    .seg { display: inline-flex; border: 1.5px solid var(--accent); border-radius: 8px; overflow: hidden; }
    .seg button { padding: 8px 14px; font-weight: 700; color: var(--accent); font-size: 14px; }
    .seg button.on { background: var(--accent); color: var(--accent-fg); }
    .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .bar input[type=search] { flex: 1; min-width: 160px; }
    .f { display: block; margin-bottom: 14px; }
    .f > span.l { display: block; font-weight: 700; margin-bottom: 5px; font-size: 14px; }
    .f > span.h { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
    .amt { position: relative; }
    .amt b { position: absolute; left: 12px; top: 10px; font-weight: 700; color: var(--muted); }
    .amt input { padding-left: 28px !important; font-size: 18px; font-weight: 700; }
    .chk { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; cursor: pointer; }
    .chk input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
    .payees { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .payees button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13.5px; }
    .steps { display: flex; gap: 6px; margin-bottom: 16px; }
    .steps span { flex: 1; height: 5px; border-radius: 4px; background: var(--surface-2); }
    .steps span.on { background: var(--accent); }
    .sum { width: 100%; border-collapse: collapse; }
    .sum td { padding: 11px 0; border-bottom: 1px solid var(--line); }
    .sum td:last-child { text-align: right; font-weight: 700; }
    .sum tr:last-child td { border-bottom: 0; }
    .done { text-align: center; padding: 10px 0 4px; }
    .done .tick { width: 66px; height: 66px; border-radius: 50%; background: var(--good-bg); color: var(--good); font-size: 34px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }
    .li { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: var(--bg); }
    .li .r1 { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
    .li .r1 b { font-size: 16px; }
    .li .amt2 { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 17px; }
    .li .meta { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
    .li .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tg { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); }
    .tg.good { background: var(--good-bg); color: var(--good); } .tg.bad { background: var(--bad-bg); color: var(--bad); } .tg.warn { background: var(--warn-bg); color: var(--warn); }
    .kv2 { width: 100%; border-collapse: collapse; }
    .kv2 td { padding: 11px 0; border-bottom: 1px solid var(--line); }
    .kv2 td:first-child { color: var(--muted); width: 44%; } .kv2 td:last-child { font-weight: 600; text-align: right; }
    .kv2 tr:last-child td { border-bottom: 0; }
    .empty { text-align: center; color: var(--muted); padding: 26px 8px; }
    .mask { position: fixed; inset: 0; background: rgba(6,16,28,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
    .dlg { background: var(--bg); border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; max-height: 90vh; overflow: auto; }
    .dlg h2 { font-size: 18px; } .dlg .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .side a { display: block; padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
    .side a:last-child { border-bottom: 0; }
    .foot { max-width: 1040px; margin: 22px auto 26px; padding: 16px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); text-align: center; }
    .err { color: var(--bad); font-weight: 600; margin: 4px 0 12px; }
</style>
</head>
<body>
<header class="hd"><div class="in">
    <div class="logo" id="logo" data-go="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff"/><path d="M6 12.5 16 6l10 6.5v1.5H6z" fill="#0f4c81"/><rect x="8" y="15" width="3" height="8" fill="#0f4c81"/><rect x="14.5" y="15" width="3" height="8" fill="#0f4c81"/><rect x="21" y="15" width="3" height="8" fill="#0f4c81"/><rect x="6" y="24.5" width="20" height="2.5" fill="#0e8f7e"/></svg>
        <div><span id="siteName">LS Bank</span><small id="siteTag"></small></div>
    </div>
    <div class="who"><b id="whoName"></b><span class="secure" id="secure"></span></div>
</div></header>
<nav class="mn"><div class="in" id="nav"></div></nav>
<div class="pg" id="app"><div class="spinner"></div></div>
<div class="foot" id="foot"></div>
<div id="modal"></div>

<script src="/sdk/site.js"></script>
<script>
(function () {
    var esc = Site.esc, app = document.getElementById('app');
    var D = null, path = '/', TX = { list: [], more: false, q: '', dir: '', busy: false };
    var P = null, ST = null, IV = null, INV = { tab: 'in' };

    // Text: the locale key, with the English wording as the fallback (the same wording is in locales/lsbank_en.lua).
    function L(key, def) {
        var s = (window.I18N && Object.prototype.hasOwnProperty.call(window.I18N, key)) ? window.I18N[key] : def;
        var args = Array.prototype.slice.call(arguments, 2), i = 0;
        return String(s).replace(/%[sd]/g, function () { return i < args.length ? args[i++] : ''; });
    }
    function money(n) { var v = Number(n) || 0; return (v < 0 ? '−' : '') + Site.money(Math.abs(v)); }
    function fmtNum(d) {
        d = String(d || '').replace(/\D/g, '');
        if (d.length === 11) return d.slice(0, 5) + ' ' + d.slice(5);
        if (d.length === 10) return d.slice(0, 3) + ' ' + d.slice(3, 6) + ' ' + d.slice(6);
        if (d.length === 7) return d.slice(0, 3) + ' ' + d.slice(3);
        return d;
    }
    function greeting() {
        var h = new Date().getHours();
        return h < 12 ? L('bank.goodMorning', 'Good morning') : h < 18 ? L('bank.goodAfternoon', 'Good afternoon') : L('bank.goodEvening', 'Good evening');
    }
    function first(name) { return String(name || '').split(/\s+/)[0]; }
    function err(e) { return '<div class="err">' + esc(e && e.message ? e.message : L('bank.errGeneric', 'Something went wrong.')) + '</div>'; }
    function setPage(title, html) { Site.title(title); app.innerHTML = html; window.scrollTo(0, 0); }
    function day(ts) { return Site.date(ts); }
    var GLYPH = { transfer: '⇄', income: '↓', invoice: '🧾', government: '🏛', standing: '↻', purchase: '🛒', bill: '🧾' };
    var EVERY = { daily: L('bank.daily', 'Every day'), weekly: L('bank.weekly', 'Every week'), monthly: L('bank.monthly', 'Every month') };
    var CARD = {
        emerald: ['#1c8a60', '#0a3f2d'], crimson: ['#c0392b', '#4a0f0f'], cobalt: ['#2276dc', '#0c2f62'], navy: ['#2b5089', '#0d1b33'],
        bronze: ['#b07a3c', '#4d3013'], graphite: ['#4a4f58', '#16181c'], teal: ['#1aa39a', '#0a4a46'], violet: ['#7b4fd6', '#2c1667'],
        slate: ['#5c6f86', '#22303f'], amber: ['#e0a02a', '#6b4408'], rose: ['#d8577e', '#5e1730'], midnight: ['#243b6b', '#070d1c'],
        mint: ['#3cc79a', '#125a44'], burgundy: ['#9b2545', '#3a0a19']
    };

    // ------------------------------------------------------------------ shell
    function nav(active) {
        var items = [['/', L('bank.nav.accounts', 'Accounts')], ['/pay', L('bank.nav.pay', 'Pay & transfer')]];
        if (D.features.standing) items.push(['/standing-orders', L('bank.nav.standing', 'Standing orders')]);
        if (D.features.invoices || D.features.business) items.push(['/invoices', L('bank.nav.invoices', 'Invoices')]);
        items.push(['/transactions', L('bank.nav.statements', 'Statements')], ['/account', L('bank.nav.account', 'Account details')]);
        document.getElementById('nav').innerHTML = items.map(function (x) {
            var badge = x[0] === '/invoices' && D.pendingInvoices > 0 ? '<span class="bdg">' + D.pendingInvoices + '</span>' : '';
            return '<button class="' + (active === x[0] ? 'on' : '') + '" data-go="' + x[0] + '">' + esc(x[1]) + badge + '</button>';
        }).join('');
    }
    function modal(html) { document.getElementById('modal').innerHTML = html ? '<div class="mask"><div class="dlg">' + html + '</div></div>' : ''; }
    function refreshBalance() {
        return Site.call('balance').then(function (r) { D.me.balance = r.balance; D.me.cash = r.cash; D.pendingInvoices = r.pendingInvoices; nav(path); }).catch(function () {});
    }

    function txRow(x) {
        var pos = x.amount > 0;
        return '<div class="tx"><div class="ic">' + (GLYPH[x.category] || '💳') + '</div><div class="ds"><b>' + esc(x.label) + '</b><small>' + esc(Site.datetime(x.at)) +
            (x.peer ? ' · ' + esc(fmtNum(x.peer)) : '') + '</small></div><div class="am ' + (pos ? 'p' : '') + '">' + (pos ? '+' : '') + esc(money(x.amount)) + '</div></div>';
    }
    function cardHtml() {
        var c = CARD[D.me.card] || CARD.emerald, last = String(D.me.account).slice(-4);
        return '<div class="card3d" style="background:radial-gradient(125% 135% at 12% 8%,' + c[0] + ',' + c[1] + ')"><div class="top"><span>' + esc(D.name) + '</span><span class="chip"></span></div>' +
            '<div class="num">•••• •••• •••• ' + esc(last) + '</div><div class="bot"><span>' + esc(D.me.name) + '</span><span>08/29</span></div></div>';
    }

    // ------------------------------------------------------------------ pages
    function home() {
        nav('/');
        var m = D.me, inv = D.pendingInvoices;
        setPage(D.name,
            '<h1>' + esc(greeting() + ', ' + first(m.name)) + '</h1><div class="sub">' + esc(L('bank.yourAccounts', 'Your accounts')) + '</div>' +
            (inv > 0 ? '<div class="alert" data-go="/invoices"><span>🧾</span><span class="g">' + esc(inv === 1 ? L('bank.invOne', 'You have 1 invoice waiting to be paid.') : L('bank.invMany', 'You have %s invoices waiting to be paid.', inv)) + '</span><span>›</span></div>' : '') +
            '<div class="cols"><div><div class="panel acct"><div class="type">' + esc(L('bank.current', 'Current account')) + '</div><div class="nums">' + esc(D.me.sortCode) + ' · ' + esc(m.account) + '</div>' +
            '<div class="bal ' + (m.balance < 0 ? 'neg' : '') + '">' + esc(money(m.balance)) + '</div><div class="lbl">' + esc(L('bank.available', 'Available balance')) + '</div>' +
            '<div class="tiles"><div class="tile"><div class="l">' + esc(L('bank.in30', 'Money in, last 30 days')) + '</div><div class="v in">' + esc(money(D.month['in'])) + '</div></div>' +
            '<div class="tile"><div class="l">' + esc(L('bank.out30', 'Money out, last 30 days')) + '</div><div class="v">' + esc(money(D.month.out)) + '</div></div></div>' +
            '<div class="acts"><button class="b" data-go="/pay">' + esc(L('bank.payNow', 'Pay someone')) + '</button><button class="b sec" data-go="/transactions">' + esc(L('bank.viewStatement', 'View statement')) + '</button></div></div>' +
            '<div class="panel"><h2>' + esc(L('bank.recent', 'Recent transactions')) + '</h2>' + (D.recent.length ? D.recent.slice(0, 8).map(txRow).join('') : '<div class="empty">' + esc(L('bank.noTx', 'No transactions yet.')) + '</div>') +
            (D.recent.length ? '<div class="acts"><button class="b sec sm" data-go="/transactions">' + esc(L('bank.allTx', 'All transactions')) + '</button></div>' : '') + '</div></div>' +
            '<div><div class="panel">' + cardHtml() + '<table class="kv2" style="margin-top:14px"><tr><td>' + esc(L('bank.cash', 'Cash in hand')) + '</td><td>' + esc(money(m.cash)) + '</td></tr>' +
            '<tr><td>' + esc(L('bank.payByMobile', 'Pay-by mobile number')) + '</td><td>' + esc(fmtNum(m.number)) + '</td></tr></table></div>' +
            '<div class="panel side"><h2>' + esc(L('bank.quick', 'Quick links')) + '</h2><a data-go="/pay">' + esc(L('bank.nav.pay', 'Pay & transfer')) + '</a>' +
            (D.features.standing ? '<a data-go="/standing-orders">' + esc(L('bank.nav.standing', 'Standing orders')) + '</a>' : '') +
            (D.features.invoices || D.features.business ? '<a data-go="/invoices">' + esc(L('bank.nav.invoices', 'Invoices')) + '</a>' : '') +
            '<a data-go="/account">' + esc(L('bank.nav.account', 'Account details')) + '</a></div></div></div>');
    }

    // ---- statement
    function loadTx(reset) {
        if (TX.busy) return;
        if (reset) { TX.list = []; TX.more = false; }
        TX.busy = true;
        Site.call('transactions', { q: TX.q, dir: TX.dir, offset: TX.list.length }).then(function (r) {
            TX.list = TX.list.concat(r.transactions); TX.more = r.more; TX.busy = false; drawTx();
        }).catch(function (e) { TX.busy = false; var b = document.getElementById('txbody'); if (b) b.innerHTML = err(e); });
    }
    function drawTx() {
        var b = document.getElementById('txbody');
        if (!b) return;
        var html = '', last = '';
        TX.list.forEach(function (x) {
            var d = day(x.at);
            if (d !== last) { html += '<div class="dayh">' + esc(d) + '</div>'; last = d; }
            html += txRow(x);
        });
        if (!TX.list.length) html = '<div class="empty">' + esc(TX.q || TX.dir ? L('bank.noMatch', 'Nothing matches that search.') : L('bank.noTx', 'No transactions yet.')) + '</div>';
        if (TX.more) html += '<div class="acts" style="justify-content:center"><button class="b sec" id="more">' + esc(L('bank.loadMore', 'Show more')) + '</button></div>';
        b.innerHTML = html;
        var sp = document.getElementById('stmt-print'); if (sp) sp.setAttribute('data-pd', JSON.stringify({ q: TX.q, dir: TX.dir }));
        var c = document.getElementById('txcount'); if (c) c.textContent = TX.list.length ? L('bank.showing', 'Showing %s', TX.list.length) : '';
    }
    function transactions() {
        nav('/transactions');
        setPage(L('bank.nav.statements', 'Statements'),
            '<h1>' + esc(L('bank.nav.statements', 'Statements')) + '</h1><div class="sub">' + esc(L('bank.stmtSub', 'Everything that has gone in and out of your account, the same list as the Wallet on your phone.')) + '</div>' +
            '<div class="panel"><div class="bar"><input type="search" id="q" placeholder="' + esc(L('bank.search', 'Search transactions')) + '" value="' + esc(TX.q) + '" autocomplete="off">' +
            '<div class="seg" id="dir"><button data-dir="" class="' + (TX.dir === '' ? 'on' : '') + '">' + esc(L('bank.all', 'All')) + '</button><button data-dir="in" class="' + (TX.dir === 'in' ? 'on' : '') + '">' + esc(L('bank.moneyIn', 'Money in')) +
            '</button><button data-dir="out" class="' + (TX.dir === 'out' ? 'on' : '') + '">' + esc(L('bank.moneyOut', 'Money out')) + '</button></div></div>' +
            '<div id="txbody"><div class="spinner"></div></div><div class="sub" style="margin:12px 0 0" id="txcount"></div>' +
            '<div class="acts" style="margin-top:10px"><button class="b sm sec" id="stmt-print" data-print="statementPrint" data-pd="{}" data-ptitle="' + esc(L('bank.nav.statements', 'Statements')) + '">' + esc(L('print.button', 'Print')) + '</button></div></div>');
        loadTx(true);
    }

    // ---- pay

    // ------------------------------------------------------------------ routing
    function render(p) {
        path = p || '/';
        var base = '/' + (path.split('?')[0].split('/')[1] || '');
        modal('');
        if (base === '/pay') pay();
        else if (base === '/transactions') transactions();
        else if (base === '/standing-orders' && D.features.standing) standing();

        else if (base === '/account') account();
        else { path = '/'; home(); }
    }

        if (d.imode !== undefined) {
            INV.mode = d.imode;
            document.querySelectorAll('#iv-mode button').forEach(function (b) { b.classList.toggle('on', b.dataset.imode === INV.mode); });
            document.getElementById('iv-tol').textContent = INV.mode === 'id' ? L('bank.serverId', 'Server ID') : L('bank.mobile', 'Mobile number');
            return;
        }
        switch (t.id) {
            case 'more': loadTx(false); break;
            case 'p-next': payNext(); break;
            case 'p-back': P.step = 1; P.err = ''; drawPay(); break;
            case 'p-confirm': payConfirm(); break;
            case 'p-again': P = newPay(); drawPay(); break;
            case 'so-new': soForm(null); break;
            case 'so-cancel': case 'dlg-no': case 'iv-cancel': case 'dlg-ok': modal(''); break;
            case 'so-save': soSave(); break;
            case 'so-delgo':
                Site.call('standingDelete', { id: t.dataset.id }).then(function (r) { ST.orders = r.orders; modal(''); drawStanding(); }).catch(alert_); break;
            case 'iv-new': ivForm(); break;
            case 'iv-send': {
                var box = document.getElementById('iv-err'), o2 = { amount: document.getElementById('iv-amt').value, note: document.getElementById('iv-note').value };
                o2[INV.mode === 'id' ? 'serverId' : 'number'] = document.getElementById('iv-to').value;
                Site.call('invoiceCreate', o2).then(function (r) { IV = r; INV.tab = 'out'; modal(''); drawInvoices(); }).catch(function (er) { box.innerHTML = err(er); });
                break;
            }
            case 'ip-go': {
                var b2 = document.getElementById('ip-err');
                Site.call('invoicePay', { id: t.dataset.id }).then(function (r) {
                    IV = r; D.me.balance = r.balance; D.pendingInvoices = r.received.filter(function (i) { return i.status === 'pending'; }).length; nav('/invoices'); modal(''); drawInvoices();
                }).catch(function (er) { b2.innerHTML = err(er); });
                break;
            }
        }
    });
    document.addEventListener('input', function (e) {
        var id = e.target.id;
        if (id === 'p-to') P.to = e.target.value; else if (id === 'p-amt') P.amount = e.target.value; else if (id === 'p-note') P.note = e.target.value;
        else if (id === 'q') { TX.q = e.target.value; clearTimeout(TX.t); TX.t = setTimeout(function () { loadTx(true); }, 350); }
    });
    document.addEventListener('change', function (e) { if (e.target.id === 'p-anon') P.anon = e.target.checked; });

    // ------------------------------------------------------------------ start
    Site.onRoute(function (p) {
        if (D) return render(p);
        Site.call('init').then(function (r) {
            D = r; Site.currency = r.currency || Site.currency;
            document.getElementById('siteName').textContent = r.name;
            document.getElementById('siteTag').textContent = r.tagline || '';
            document.getElementById('whoName').textContent = r.me.name;
            document.getElementById('secure').textContent = '🔒 ' + L('bank.secure', 'Secure session');
            document.getElementById('foot').innerHTML = (r.footer || []).map(function (x) { return '<div>' + esc(x) + '</div>'; }).join('');
            render(p);
        }).catch(function (e) { app.innerHTML = err(e); });
    });
})();
</script>
</body>
</html>
