<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presento</title>
<link rel="stylesheet" href="/sdk/site.css">
<style>
:root {
    --accent: #ff7a1a; --accent-fg: #ffffff; --accent-soft: #fff1e6;
    --page: #ffffff; --band: #f1f3f4; --card: #ffffff; --ink: #1f2328; --muted: #5f6368; --line: #dadce0; --hover: #f1f3f4;
    --menu: #ffffff; --shadow: 0 2px 6px rgba(60,64,67,.15), 0 1px 2px rgba(60,64,67,.3);
}
:root[data-theme="dark"] {
    --accent: #ff8a33; --accent-fg: #1a0c00; --accent-soft: #3a2413;
    --page: #16181c; --band: #1f2227; --card: #1f2227; --ink: #eceef1; --muted: #a3a9b3; --line: #33373f; --hover: #2a2e35;
    --menu: #272b32; --shadow: 0 4px 14px rgba(0,0,0,.5);
}
html, body { background: var(--page); color: var(--ink); }
body { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.inner { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--line); }
.top .inner { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: calc(21px * var(--ts, 1)); font-weight: 600; color: var(--ink); white-space: nowrap; }
.mark { width: 34px; height: 40px; border-radius: 5px; background: var(--accent); position: relative; flex: none; }
.mark::after { content: ""; position: absolute; left: 7px; right: 7px; top: 13px; height: 14px; border: 2.5px solid #fff; border-radius: 2px; }
.search { flex: 1; max-width: 720px; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: 10px; background: var(--band); }
.search:focus-within { background: var(--card); box-shadow: var(--shadow); }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; min-height: 0; height: 100%; border: 0; padding: 0; background: none; box-shadow: none !important; font-size: calc(16px * var(--ts, 1)); }
.search .x { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.search .x:hover { background: var(--hover); }
.avatar { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-weight: 700; flex: none; }

/* start band */
.band { background: var(--band); padding: 18px 0 22px; }
.band h3 { font-size: calc(15px * var(--ts, 1)); font-weight: 500; margin: 0 0 12px; }
.starts { display: flex; gap: 18px; }
.start { width: 170px; text-align: left; }
.start .pv { height: 96px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); display: grid; place-items: center; transition: border-color .15s; }
.start:hover .pv { border-color: var(--accent); }
.start .plus { width: 48px; height: 48px; position: relative; }
.start .plus::before, .start .plus::after { content: ""; position: absolute; background: var(--accent); border-radius: 2px; }
.start .plus::before { left: 21px; top: 0; width: 6px; height: 48px; }
.start .plus::after { top: 21px; left: 0; height: 6px; width: 48px; }
.start span { display: block; margin-top: 8px; font-size: calc(14px * var(--ts, 1)); font-weight: 500; }

/* list */
.bar { display: flex; align-items: center; gap: 6px; margin: 20px 0 12px; }
.tab { padding: 8px 14px; border-radius: 18px; font-size: calc(14px * var(--ts, 1)); font-weight: 500; color: var(--muted); }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--accent-soft); color: var(--accent); }
.bar .sp { flex: 1; }
.pbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 18px; font-size: calc(14px * var(--ts, 1)); font-weight: 500; }
.pbtn:hover { background: var(--hover); }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: calc(18px * var(--ts, 1)); margin: 6px 0 14px; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--ink); }
.crumbs b { font-weight: 500; }
.sec { font-size: calc(13.5px * var(--ts, 1)); font-weight: 500; color: var(--muted); margin: 18px 0 10px; }

.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.folder { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 6px 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); text-align: left; }
.folder:hover { background: var(--hover); }
.folder .fi { font-size: 20px; }
.folder .fn { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.folder .fc { font-size: calc(12px * var(--ts, 1)); color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; padding-bottom: 30px; }
.deck { border: 1px solid var(--line); border-radius: 8px; background: var(--card); overflow: hidden; cursor: pointer; transition: border-color .15s; display: flex; flex-direction: column; }
.deck:hover { border-color: var(--accent); }
.deck .pv { aspect-ratio: 16 / 9; border-bottom: 1px solid var(--line); background: var(--band); position: relative; overflow: hidden; display: grid; place-items: center; }
.deck .pv .noth { font-size: 34px; opacity: .6; }
.deck .info { padding: 10px 6px 10px 12px; display: flex; align-items: flex-start; gap: 6px; }
.deck .tt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck .meta { display: flex; align-items: center; gap: 6px; font-size: calc(12.5px * var(--ts, 1)); color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; }
.deck .mk { width: 16px; height: 18px; border-radius: 2px; background: var(--accent); flex: none; }
.kebab { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.kebab:hover { background: var(--hover); color: var(--ink); }
.kebab svg { width: 18px; height: 18px; }
.empty { text-align: center; color: var(--muted); padding: 50px 0; }
.empty .big { font-size: 46px; margin-bottom: 8px; }

/* slide renderer (shared with the editor) */
.slide { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #fff; }
.slide .el { position: absolute; box-sizing: border-box; }
.slide .txt { display: flex; flex-direction: column; overflow: visible; white-space: pre-wrap; word-wrap: break-word; line-height: 1.2; padding: 6px 10px; }
.slide .txt.v-middle { justify-content: center; } .slide .txt.v-bottom { justify-content: flex-end; }
.slide .txt .ph { opacity: .45; }
.slide .txt [contenteditable] { outline: none; cursor: text; min-height: 1.2em; }
.slide img.el { object-fit: cover; }
.slide svg.el { overflow: visible; }
.slide .vid { background: #111 center / cover no-repeat; display: grid; place-items: center; overflow: hidden; }
.slide .vid .play { width: 120px; height: 120px; border-radius: 50%; background: rgba(0,0,0,.6); position: relative; }
.slide .vid .play::after { content: ""; position: absolute; left: 46px; top: 32px; border-style: solid; border-width: 28px 0 28px 44px; border-color: transparent transparent transparent #fff; }
.slide .vid .vbadge { position: absolute; left: 16px; bottom: 14px; padding: 6px 14px; border-radius: 8px; background: rgba(0,0,0,.7); color: #fff; font: 600 22px "Segoe UI", Arial, sans-serif; }
.slide iframe.el, .slide video.el { border: 0; background: #000; }
.slide table.el { border-collapse: collapse; table-layout: fixed; }
.slide table.el td { border: 1px solid #9aa0a6; padding: 6px 10px; overflow: hidden; word-wrap: break-word; vertical-align: middle; }
.slide table.el td[contenteditable] { outline: none; cursor: text; }
.slide table.el td[contenteditable]:focus { box-shadow: inset 0 0 0 2px #1a73e8; }

/* editor */
.ed { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--band); }
.ed-top { flex: none; display: flex; align-items: center; gap: 10px; height: 58px; padding: 0 14px; background: var(--band); }
.ed-top .back { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ed-top .back:hover { background: var(--hover); }
.ed-top .mark { width: 28px; height: 34px; }
.ed-top .mark::after { left: 6px; right: 6px; top: 11px; height: 11px; border-width: 2px; }
.ed-title { font-size: calc(18px * var(--ts, 1)) !important; min-height: 0 !important; height: 30px; width: 420px; max-width: 46vw; padding: 2px 6px !important; border: 1px solid transparent !important; border-radius: 4px !important; background: none !important; box-shadow: none !important; }
.ed-title:hover { border-color: var(--line) !important; }
.ed-title:focus { border-color: var(--accent) !important; background: var(--page) !important; }
.ed-title[readonly] { border-color: transparent !important; }
.ed-status { font-size: calc(12.5px * var(--ts, 1)); color: var(--muted); padding-left: 7px; white-space: nowrap; }
.ed-status.err { color: var(--bad); }
.ed-top .grow { min-width: 0; }
.ed-top .ro { margin-left: auto; font-size: calc(13px * var(--ts, 1)); font-weight: 600; padding: 6px 12px; border-radius: 14px; background: var(--page); color: var(--muted); }
.ed-tools { flex: none; display: flex; align-items: center; gap: 2px; height: 42px; margin: 0 10px 8px; padding: 0 8px; background: var(--page); border-radius: 21px; overflow-x: auto; overflow-y: hidden; }
.ed-tools::-webkit-scrollbar { height: 0; }
.tb { position: relative; height: 32px; min-width: 32px; padding: 0 6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; color: var(--ink); font-size: calc(13.5px * var(--ts, 1)); flex: none; white-space: nowrap; }
.tb:hover:not(:disabled) { background: var(--hover); }
.tb.on { background: var(--accent-soft); color: var(--accent); }
.tb:disabled { opacity: .35; cursor: default; }
.tb svg { width: 18px; height: 18px; flex: none; }
.tb.clr { flex-direction: column; gap: 1px; }
.tb.clr svg { width: 16px; height: 16px; }
.tb .bar { display: block; width: 18px; height: 4px; border-radius: 1px; box-shadow: 0 0 0 1px rgba(128,128,128,.35); }
.tb.clr span:not(.bar) { display: none; }
.tb b, .tb i, .tb u { font-size: calc(15px * var(--ts, 1)); font-family: Georgia, serif; }
.tsep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; flex: none; }
.tsel { height: 30px !important; min-height: 0 !important; padding: 0 6px !important; width: auto !important; border-radius: 6px !important; font-size: calc(13.5px * var(--ts, 1)) !important; background: var(--page) !important; flex: none; }
.tnum { width: 58px !important; }
.ed-body { flex: 1; min-height: 0; display: flex; }
.ed-strip { width: 196px; flex: none; overflow-y: auto; padding: 0 8px 24px 4px; }
.ed-strip::-webkit-scrollbar { width: 6px; } .ed-strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.st-add { display: flex; margin: 0 0 6px 24px; }
.st-add button { height: 32px; border-radius: 16px 0 0 16px; padding: 0 12px; background: var(--page); font-size: calc(13px * var(--ts, 1)); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.st-add button + button { border-radius: 0 16px 16px 0; padding: 0 8px; border-left: 1px solid var(--line); }
.st-add button:hover { background: var(--hover); }
.st-add svg { width: 14px; height: 14px; }
.st { display: flex; gap: 6px; padding: 5px 4px; border-radius: 8px; cursor: pointer; }
.st .n { width: 18px; text-align: right; font-size: calc(12px * var(--ts, 1)); color: var(--muted); padding-top: 2px; flex: none; }
.st .pv { flex: 1; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border: 2px solid var(--line); border-radius: 6px; background: #fff; }
.st:hover .pv { border-color: var(--muted); }
.st.on .pv { border-color: var(--accent); }
.st.on .n { color: var(--accent); font-weight: 700; }
.st.dropB { box-shadow: inset 0 3px 0 var(--accent); }
.st.dropA { box-shadow: inset 0 -3px 0 var(--accent); }
.ed-stage { flex: 1; min-width: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
.ed-canvas { position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.2), 0 4px 18px rgba(0,0,0,.12); }
.ed .slide .el { cursor: default; }
.ed.can .slide .el { cursor: move; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.selbox { position: absolute; border: calc(1.5px * var(--inv, 1)) solid #1a73e8; }
.selbox.editing { border-style: dashed; }
.hd { position: absolute; width: calc(11px * var(--inv, 1)); height: calc(11px * var(--inv, 1)); background: #fff; border: calc(1.5px * var(--inv, 1)) solid #1a73e8; border-radius: 2px; pointer-events: auto; transform: translate(-50%, -50%); }
.hd[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } .hd[data-h=n] { left: 50%; top: 0; cursor: ns-resize; }
.hd[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } .hd[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; }
.hd[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; } .hd[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
.hd[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; } .hd[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
.hd[data-h=rot] { left: 50%; top: calc(-26px * var(--inv, 1)); border-radius: 50%; cursor: grab; }
.guide { position: absolute; background: #e8467c; display: none; }
.guide.v { top: 0; bottom: 0; width: calc(1px * var(--inv, 1)); }
.guide.h { left: 0; right: 0; height: calc(1px * var(--inv, 1)); }

/* popups: palette */
.menu.pal { padding: 10px; width: 244px; min-width: 0; }
.menu.pal button { display: block; width: auto; padding: 0; }
.pal .sws { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.pal .sw { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.pal .sw.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.menu.pal .none { display: block; width: 100%; margin-bottom: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; font-size: calc(13px * var(--ts, 1)); }
.pal .none:hover { background: var(--hover); }
.pal .hex { display: flex; gap: 6px; margin-top: 10px; }
.pal .hex input { min-height: 0; height: 32px; padding: 0 8px; font-size: 13px; background: var(--page); }
.menu.pal .hex button { padding: 0 12px; border-radius: 6px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.start.tpl .pv { position: relative; overflow: hidden; display: block; }
.start .pv.gs { background: #fff8e6; }
.start .gsl { width: 44px; height: 56px; border-radius: 4px; background: #f4b400; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.start .gsl::after { content: ""; position: absolute; left: 9px; right: 9px; top: 20px; height: 14px; border: 3px solid #fff; border-radius: 2px; }
.starts { overflow-x: auto; padding-bottom: 4px; }
.starts .start { flex: none; }
.prs { display: flex; flex: none; }
.prs button { height: 36px; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 0 16px; border-radius: 18px 0 0 18px; font-size: calc(14px * var(--ts, 1)); }
.prs button + button { padding: 0 10px; border-radius: 0 18px 18px 0; margin-left: 1px; }
.prs button:hover { filter: brightness(1.06); }
.prs svg { width: 14px; height: 14px; }
.stepchip { position: absolute; left: 0; top: 0; transform: translate(-120%, -120%); min-width: calc(22px * var(--inv, 1)); height: calc(22px * var(--inv, 1)); padding: 0 calc(5px * var(--inv, 1)); border-radius: calc(11px * var(--inv, 1)); background: #1a73e8; color: #fff; font: 700 calc(13px * var(--inv, 1)) / calc(22px * var(--inv, 1)) "Segoe UI", Arial, sans-serif; text-align: center; }
.menu.thp { display: grid; grid-template-columns: repeat(4, 116px); gap: 10px; padding: 12px; }
.menu.thp button { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 0; width: auto; font-size: calc(12.5px * var(--ts, 1)); text-align: center; }
.menu.thp button:hover { background: none; }
.thc .sw { position: relative; height: 66px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(128,128,128,.35); display: grid; place-items: center; }
.thc .sw b { font-size: 24px; }
.thc .sw i { position: absolute; left: 10px; bottom: 10px; width: 28px; height: 5px; border-radius: 2px; }
.thc:hover .sw { box-shadow: inset 0 0 0 2px var(--muted); }
.thc.on .sw { box-shadow: inset 0 0 0 3px var(--accent); }

/* present mode */
.pr { position: fixed; inset: 0; z-index: 90; background: #000; cursor: none; user-select: none; }
.pr.ui { cursor: default; }
.pr-stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
.pr-slide { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; }
.pr-slide .slide .el { cursor: inherit; }
.pr-end { color: #9aa0a6; font-size: 20px; }
.tr-fade { animation: prFade .6s ease both; }
.tr-slide { animation: prSlide .6s cubic-bezier(.2,.7,.2,1) both; }
.tr-slide.back { animation-name: prSlideBack; }
.tr-zoom { animation: prZoom .6s cubic-bezier(.2,.7,.2,1) both; }
@keyframes prFade { from { opacity: 0; } }
@keyframes prSlide { from { transform: translate(50%, -50%); opacity: 0; } }
@keyframes prSlideBack { from { transform: translate(-150%, -50%); opacity: 0; } }
@keyframes prZoom { from { transform: translate(-50%, -50%) scale(.82); opacity: 0; } }
.pr-bar { position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 4px; padding: 6px 8px; border-radius: 10px; background: rgba(32,33,36,.92); color: #fff; font-size: 14px; opacity: 0; transition: opacity .25s; }
.pr.ui .pr-bar { opacity: 1; }
.pr-bar button { min-width: 34px; height: 32px; padding: 0 8px; border-radius: 6px; color: #fff; font-size: 18px; }
.pr-bar button[data-p=exit] { font-size: 13.5px; }
.pr-bar button:hover { background: rgba(255,255,255,.14); }
.pr-bar button.on { background: rgba(255,138,51,.35); }
.pr-bar span { padding: 0 8px; font-variant-numeric: tabular-nums; }
.pr-bar .pr-sep { width: 1px; height: 20px; padding: 0; background: rgba(255,255,255,.25); }
.dlg.wide { max-width: 760px; }
.ed-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ed-ic:hover { background: var(--hover); }
.ed-ic svg, .ed-share svg { width: 18px; height: 18px; }
.ed-share { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 18px; background: var(--page); border: 1px solid var(--line); font-weight: 600; font-size: calc(14px * var(--ts, 1)); flex: none; }
.ed-share:hover { background: var(--hover); }
.sh-add input { min-height: 0; height: 42px; background: var(--page); }
.sh-res { margin-top: 6px; }
.sh-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 8px; }
.sh-row:hover { background: var(--hover); }
.sh-row .grow b { display: block; font-weight: 600; }
.sh-row .grow small { color: var(--muted); font-size: calc(12.5px * var(--ts, 1)); }
.sh-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.sh-row .dot.on { background: #34a853; }
.sh-row .av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.sh-own { color: var(--muted); font-size: calc(13px * var(--ts, 1)); padding-right: 8px; }
.sh-btn { height: 32px; padding: 0 14px; border-radius: 16px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: calc(13px * var(--ts, 1)); flex: none; }
.sh-btn.plain { background: none; color: var(--accent); padding: 0 8px; }
.sh-btn:disabled { opacity: .5; }
.sh-x { width: 30px; height: 30px; border-radius: 50%; color: var(--muted); flex: none; }
.sh-x:hover { background: var(--hover); color: var(--bad); }
.sh-h { font-size: calc(13px * var(--ts, 1)); font-weight: 600; color: var(--muted); margin: 16px 0 6px; }
.sh-none, .sh-hint { color: var(--muted); font-size: calc(13.5px * var(--ts, 1)); padding: 6px 4px; }
.sh-link { display: flex; flex-direction: column; gap: 10px; }
.sh-url { display: flex; align-items: center; gap: 10px; }
.sh-url code { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; background: var(--band); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-tog { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: calc(14px * var(--ts, 1)); }
.sw-tog input { display: none; }
.sw-tog span { width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; transition: .2s; flex: none; }
.sw-tog span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
.sw-tog input:checked + span { background: var(--accent); }
.sw-tog input:checked + span::after { left: 19px; }
.hi-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.hi-top b { flex: 1; }
.hi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.hi-s { display: flex; gap: 6px; }
.hi-s span { width: 16px; color: var(--muted); font-size: 12px; text-align: right; }
.hi-s .pv { flex: 1; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 4px; }
.dlg .dbody { max-height: 64vh; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pick { position: relative; border-radius: 8px; overflow: hidden; background: var(--band); aspect-ratio: 16 / 10; border: 2px solid transparent; text-align: left; }
.pick:hover { border-color: var(--accent); }
.pick img, .pick video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.pick .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.75)); color: #fff; font-size: 12.5px; line-height: 1.25; }
.pick .cap b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .pl { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
.pick-search { display: flex; gap: 8px; margin-bottom: 12px; }
.pick-search input { min-height: 0; height: 38px; background: var(--page); }
.pick-search button { padding: 0 16px; border-radius: 19px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.dlg .fields { display: flex; gap: 12px; }
.dlg .fields label { flex: 1; font-size: calc(13px * var(--ts, 1)); color: var(--muted); }
.dlg .hint { font-size: calc(12.5px * var(--ts, 1)); color: var(--muted); margin-top: 8px; }

/* menu, dialog, toast */
.menu { position: fixed; z-index: 97; min-width: 210px; background: var(--menu); border-radius: 8px; box-shadow: var(--shadow); padding: 6px 0; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 16px; text-align: left; font-size: calc(14px * var(--ts, 1)); }
.menu button:hover { background: var(--hover); }
.menu button.danger { color: var(--bad); }
.menu .sep { height: 1px; background: var(--line); margin: 6px 0; }
.scrim { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 20px; }
.dlg { width: 100%; max-width: 440px; background: var(--menu); border-radius: 12px; padding: 22px 24px 18px; box-shadow: 0 16px 50px rgba(0,0,0,.35); }
.dlg h3 { font-size: calc(19px * var(--ts, 1)); font-weight: 500; margin: 0 0 12px; }
.dlg p { color: var(--muted); }
.dlg input, .dlg select { margin-top: 4px; background: var(--page); }
.dlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.dlg .b { height: 38px; padding: 0 18px; border-radius: 19px; font-weight: 600; }
.dlg .b.plain { color: var(--accent); }
.dlg .b.plain:hover { background: var(--hover); }
.dlg .b.main { background: var(--accent); color: var(--accent-fg); }
.dlg .b.main.danger { background: var(--bad); color: #fff; }
.dlg .b:disabled { opacity: .55; cursor: default; }
.dlg .err { color: var(--bad); font-size: calc(13px * var(--ts, 1)); margin-top: 8px; min-height: 1em; }
.toast { position: fixed; left: 24px; bottom: 24px; z-index: 96; background: #323232; color: #fff; padding: 12px 18px; border-radius: 6px; font-size: calc(14px * var(--ts, 1)); opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; }
.toast.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<div id="app"><div class="spinner"></div></div>

<script src="/sdk/site.js"></script>
<script src="render.js"></script>
<script>
(function () {
    var esc = Site.esc;
    var app = document.getElementById('app');
    var IC = {
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
        x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
        dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
        back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
        folderAdd: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>',
    };

    // ------------------------------------------------------------------ slide renderer (render.js, shared with the TV page)
    var R = window.PresentoRender;
    var renderSlide = R.renderSlide, elNode = R.elNode, FONTS = R.FONTS, num = R.num, safeColor = R.safeColor, safeUrl = R.safeUrl, ytThumb = R.ytThumb;

    // ------------------------------------------------------------------ small UI helpers
    var toastEl, toastTimer;
    function toast(msg) {
        if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
        toastEl.textContent = msg;
        toastEl.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 2600);
    }

    var openMenu = null, menuAt = 0;
    function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
    document.addEventListener('mousedown', function (e) { if (openMenu && !openMenu.contains(e.target)) closeMenu(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
    window.addEventListener('scroll', function (e) { if (openMenu && openMenu.contains(e.target)) return; if (Date.now() - menuAt > 250) closeMenu(); }, true);
    // A floating panel under (or above) `anchor`. `at` = { x, y } places it at a point instead (right-click menus).
    function popup(anchor, node, at) {
        closeMenu();
        node.classList.add('menu');
        document.body.appendChild(node);
        var x, y;
        if (at) { x = at.x; y = at.y; }
        else {
            var r = anchor.getBoundingClientRect();
            x = r.left; y = r.bottom + 4;
            if (y + node.offsetHeight > window.innerHeight - 8) y = Math.max(8, r.top - node.offsetHeight - 4);
        }
        x = Math.min(x, window.innerWidth - node.offsetWidth - 8);
        if (at && y + node.offsetHeight > window.innerHeight - 8) y = Math.max(8, window.innerHeight - node.offsetHeight - 8);
        node.style.left = Math.max(8, x) + 'px'; node.style.top = y + 'px';
        openMenu = node;
        menuAt = Date.now();
        return node;
    }
    // items: [{ label, run, danger, on, disabled }] or '-' for a line
    function menu(anchor, items, at) {
        var m = document.createElement('div');
        items.forEach(function (it) {
            if (it === '-') { m.appendChild(Object.assign(document.createElement('div'), { className: 'sep' })); return; }
            var b = document.createElement('button');
            b.textContent = (it.on ? '✓ ' : '') + it.label;
            if (it.danger) b.className = 'danger';
            if (it.disabled) { b.disabled = true; b.style.opacity = '.4'; }
            b.onclick = function (e) { e.stopPropagation(); closeMenu(); it.run(); };
            m.appendChild(b);
        });
        if (!at) {
            popup(anchor, m);
            var r = anchor.getBoundingClientRect();
            if (anchor.classList.contains('kebab')) m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8)) + 'px';
            return m;
        }
        return popup(null, m, at);
    }

    // dialog({ title, body, hint, input: { value, max, placeholder }, select: { options, value },
    //          selects: [{ label, options, value }], ok, danger, run(value) -> Promise })
    function dialog(o) {
        var scrim = document.createElement('div');
        scrim.className = 'scrim';
        function opts(list, val) {
            return list.map(function (op) {
                return '<option value="' + esc(op.value) + '"' + (String(op.value) === String(val) ? ' selected' : '') + '>' + esc(op.label) + '</option>';
            }).join('');
        }
        var h = '<div class="dlg' + (o.wide ? ' wide' : '') + '"><h3>' + esc(o.title) + '</h3>';
        if (o.body) h += '<p>' + esc(o.body) + '</p>';
        if (o.input) h += '<input type="text" id="dlgIn" maxlength="' + (o.input.max || 100) + '" value="' + esc(o.input.value || '') + '" placeholder="' + esc(o.input.placeholder || t('presento.d.name')) + '">';
        if (o.select) h += '<select id="dlgIn">' + opts(o.select.options, o.select.value) + '</select>';
        if (o.selects) h += '<div class="fields">' + o.selects.map(function (f, i) {
            return '<label>' + esc(f.label) + '<select data-f="' + i + '">' + opts(f.options, f.value) + '</select></label>';
        }).join('') + '</div>';
        if (o.html != null) h += '<div class="dbody" id="dlgBody">' + o.html + '</div>';
        if (o.hint) h += '<div class="hint">' + esc(o.hint) + '</div>';
        h += '<div class="err" id="dlgErr"></div><div class="foot"><button class="b plain" id="dlgNo">' + esc(o.noOk ? t('presento.d.done') : t('presento.d.cancel')) + '</button>' +
            (o.noOk ? '' : '<button class="b main' + (o.danger ? ' danger' : '') + '" id="dlgOk">' + esc(o.ok || t('presento.d.ok')) + '</button>') + '</div></div>';
        scrim.innerHTML = h;
        document.body.appendChild(scrim);
        var input = scrim.querySelector('#dlgIn'), okB = scrim.querySelector('#dlgOk'), err = scrim.querySelector('#dlgErr');
        function close() { scrim.remove(); }
        function submit() {
            var v = input ? input.value : true;
            if (o.input && !String(v).trim()) { err.textContent = t('presento.err.needName'); return; }
            if (o.selects) {
                var picked = Array.prototype.map.call(scrim.querySelectorAll('[data-f]'), function (s) { return s.value; });
                v = o.input ? { text: v, selects: picked } : picked;
            }
            okB.disabled = true;
            err.textContent = '';
            Promise.resolve(o.run(v)).then(close, function (e) { okB.disabled = false; err.textContent = e.message; });
        }
        scrim.querySelector('#dlgNo').onclick = close;
        scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) close(); });
        scrim.addEventListener('keydown', function (e) {
            e.stopPropagation();
            if (e.key === 'Escape') close();
            if (e.key === 'Enter' && okB && e.target.tagName !== 'SELECT' && !e.target.hasAttribute('data-own-enter')) submit();
        });
        if (okB) okB.onclick = submit;
        if (o.onOpen) o.onOpen(scrim.querySelector('#dlgBody'), close, function (m) { err.textContent = m || ''; });
        if (input) { input.focus(); if (input.select && o.input) input.select(); } else if (okB) okB.focus();
    }

    function plural(key, n) { return t(key + (n === 1 ? '.one' : '.other'), n); }

    // ------------------------------------------------------------------ home
    var S = { view: 'recent', folder: null, q: '', data: null, me: '' };

    function topBar(q) {
        return '<header class="top"><div class="inner">' +
            '<button class="logo" id="goHome"><span class="mark"></span>Presento</button>' +
            '<div class="search">' + IC.search + '<input type="text" id="q" placeholder="' + esc(t('presento.searchPh')) + '" value="' + esc(q || '') + '">' +
            (q ? '<button class="x" id="qx" title="' + esc(t('presento.clearSearch')) + '">' + IC.x + '</button>' : '') + '</div>' +
            '<div class="avatar" title="' + esc(S.me) + '">' + esc((S.me || '?').charAt(0).toUpperCase()) + '</div>' +
            '</div></header>';
    }
    function wireTop() {
        document.getElementById('goHome').onclick = function () { Site.go('/'); };
        var q = document.getElementById('q');
        q.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var v = q.value.trim(); Site.go(v ? '/search/' + encodeURIComponent(v) : '/'); }
        });
        var qx = document.getElementById('qx');
        if (qx) qx.onclick = function () { Site.go('/'); };
    }

    function deckCard(d) {
        var metaTxt = d.role === 'owner' ? t('presento.edited', Site.date(d.updated)) : t('presento.ownedBy', d.owner || '?');
        var el = document.createElement('div');
        el.className = 'deck';
        el.innerHTML = '<div class="pv"></div><div class="info"><div class="grow"><div class="tt">' + esc(d.title) + '</div>' +
            '<div class="meta"><span class="mk"></span><span>' + esc(metaTxt) + '</span></div></div>' +
            '<button class="kebab">' + IC.dots + '</button></div>';
        var pv = el.querySelector('.pv');
        if (d.thumb) renderSlide(d.thumb, pv); else pv.innerHTML = '<span class="noth">📊</span>';
        el.onclick = function () { Site.go('/d/' + d.id); };
        var kb = el.querySelector('.kebab');
        kb.onclick = function (e) { e.stopPropagation(); menu(kb, deckMenu(d)); };
        return el;
    }

    function deckMenu(d) {
        var items = [{ label: t('presento.m.open'), run: function () { Site.go('/d/' + d.id); } }];
        if (d.role !== 'viewer') items.push({ label: t('presento.m.rename'), run: function () { renameDeck(d); } });
        if (d.role === 'owner') items.push({ label: t('presento.m.move'), run: function () { moveDeck(d); } });
        if (d.role === 'owner') items.push({ label: t('presento.sh5.share'), run: function () { shareDialog(d.id, d.title); } });
        items.push({ label: t('presento.m.copy'), run: function () { copyDeck(d); } });
        items.push('-');
        if (d.role === 'owner') items.push({ label: t('presento.m.delete'), danger: true, run: function () { deleteDeck(d); } });
        else items.push({ label: t('presento.m.leave'), danger: true, run: function () { leaveDeck(d); } });
        return items;
    }

    function renameDeck(d) {
        dialog({ title: t('presento.d.rename'), input: { value: d.title, max: 100 }, ok: t('presento.d.save'), run: function (v) {
            return Site.call('rename', { id: d.id, title: v }).then(function () { toast(t('presento.t.renamed')); reload(); });
        } });
    }
    function moveDeck(d) {
        var opts = [{ value: '', label: t('presento.d.noFolder') }].concat((S.data.folders || []).map(function (f) { return { value: f.id, label: f.name }; }));
        dialog({ title: t('presento.d.move', d.title), select: { options: opts, value: d.folder == null ? '' : d.folder }, ok: t('presento.d.move.go'), run: function (v) {
            return Site.call('move', { id: d.id, folder: v === '' ? null : Number(v) }).then(function () { toast(t('presento.t.moved')); reload(); });
        } });
    }
    function copyDeck(d) {
        Site.call('copy', { id: d.id }).then(function () { toast(t('presento.t.copied')); reload(); }, function (e) { toast(e.message); });
    }
    function deleteDeck(d) {
        dialog({ title: t('presento.d.delete', d.title), body: t('presento.d.deleteBody'), ok: t('presento.d.deleteGo'), danger: true, run: function () {
            return Site.call('delete', { id: d.id }).then(function () { toast(t('presento.t.deleted')); reload(); });
        } });
    }
    function leaveDeck(d) {
        dialog({ title: t('presento.d.leave', d.title), body: t('presento.d.leaveBody'), ok: t('presento.d.leaveGo'), danger: true, run: function () {
            return Site.call('leave', { id: d.id }).then(function () { toast(t('presento.t.removed')); reload(); });
        } });
    }
    function newFolder() {
        dialog({ title: t('presento.d.newFolder'), input: { value: '', max: 40 }, ok: t('presento.d.create'), run: function (v) {
            return Site.call('folderCreate', { name: v }).then(function () { toast(t('presento.t.folderMade')); reload(); });
        } });
    }
    function folderMenu(f) {
        return [
            { label: t('presento.m.renameFolder'), run: function () {
                dialog({ title: t('presento.d.renameFolder'), input: { value: f.name, max: 40 }, ok: t('presento.d.save'), run: function (v) {
                    return Site.call('folderRename', { id: f.id, name: v }).then(function () { toast(t('presento.t.renamed')); reload(); });
                } });
            } },
            '-',
            { label: t('presento.m.deleteFolder'), danger: true, run: function () {
                dialog({ title: t('presento.d.deleteFolder', f.name), body: t('presento.d.deleteFolderBody'), ok: t('presento.d.deleteGo'), danger: true, run: function () {
                    return Site.call('folderDelete', { id: f.id }).then(function () {
                        toast(t('presento.t.deleted'));
                        if (S.folder === f.id) Site.go('/mine'); else reload();
                    });
                } });
            } },
        ];
    }
    // Import a public Google Slides deck. The server finds the slides in the background and the dialog polls it.
    //   As pictures: the server builds the deck itself (one picture per slide).
    //   Editable:    the server hands over each slide's SVG in pieces; this page lays it out in a hidden element,
    //                reads every text line and picture, and builds normal slides on top of a background picture
    //                (the slide minus its text and pictures, served by the game server), then saves them.
    function importDialog() {
        var folder = S.view === 'mine' && S.folder ? S.folder : null;
        dialog({
            title: t('presento.im.title'), input: { value: '', max: 500, placeholder: 'https://docs.google.com/presentation/d/…' },
            selects: [{ label: t('presento.im.mode'), value: 'editable', options: [
                { value: 'editable', label: t('presento.im.modeEdit') }, { value: 'pictures', label: t('presento.im.modePic') }] }],
            hint: t('presento.im.hint'), ok: t('presento.im.go'),
            run: function (v) {
                var hint = document.querySelector('.scrim .hint');
                function say(msg) { if (hint) hint.textContent = msg; }
                var mode = v.selects[0] === 'pictures' ? 'pictures' : 'editable';
                return Site.call('importGoogle', { url: String(v.text).trim(), folder: folder, mode: mode }).then(function () {
                    return new Promise(function (resolve, reject) {
                        (function poll() {
                            Site.call('importStatus', {}).then(function (st) {
                                if (st.state === 'done') return resolve(st.id);
                                if (st.state === 'ready') return resolve(importBuild(st, folder, say));
                                if (st.state === 'error' || st.state === 'none') return reject(new Error(st.err || t('presento.err.importNone')));
                                say(st.found ? t('presento.im.found', st.found) : t('presento.im.looking'));
                                setTimeout(poll, 1500);
                            }, reject);
                        })();
                    });
                }).then(function (id) {
                    Site.go('/d/' + id);
                    toast(t(mode === 'pictures' ? 'presento.im.done' : 'presento.im.doneEdit'));
                }).catch(function (e) {
                    Site.call('importDone', {}).catch(function () {});
                    say(t('presento.im.hint'));
                    throw e;
                });
            },
        });
    }

    // Spaced-out calls: as-browser allows about 20 requests per 5 seconds per site.
    function importPaced(name, data) {
        return new Promise(function (r) { setTimeout(r, 270); }).then(function () { return Site.call(name, data); });
    }

    function importBuild(st, folder, say) {
        var n = st.slides || 0, slides = [], noBg = !st.hasBg;
        var chain = Promise.resolve();
        for (var i = 1; i <= n; i++) (function (i) {
            chain = chain.then(function () {
                say(t('presento.im.reading', i, n));
                return importPaced('importPart', { slide: i, part: 1 }).then(function (first) {
                    var texts = [first.text || ''], more = Promise.resolve();
                    for (var p = 2; p <= (first.parts || 1); p++) (function (p) {
                        more = more.then(function () { return importPaced('importPart', { slide: i, part: p }).then(function (r) { texts[p - 1] = r.text || ''; }); });
                    })(p);
                    return more.then(function () { slides.push(svgToSlide(texts.join(''), first.bg, first.png)); });
                });
            });
        })(i);
        var deckId;
        return chain.then(function () {
            say(t('presento.im.creating'));
            return importPaced('importCreate', { folder: folder });
        }).then(function (r) {
            deckId = r.id;
            var sids = [], save = Promise.resolve();
            slides.forEach(function (sl, idx) {
                var sid = uid('s');
                sids.push(sid);
                save = save.then(function () {
                    say(t('presento.im.saving', idx + 1, slides.length));
                    return importPaced('saveSlide', { id: deckId, sid: sid, data: sl });
                });
            });
            return save.then(function () { return importPaced('order', { id: deckId, sids: sids }); });
        }).then(function () {
            Site.call('importDone', {}).catch(function () {});
            if (noBg) setTimeout(function () { toast(t('presento.im.noBg')); }, 2500);
            return deckId;
        });
    }

    // ---- reading Google's SVG export ------------------------------------------------------------------
    function cssHex(c, d) {
        var m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(String(c || ''));
        if (!m) return /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : d;
        return '#' + [m[1], m[2], m[3]].map(function (x) { return ('0' + Number(x).toString(16)).slice(-2); }).join('');
    }
    function mapFont(f) {
        f = String(f || '').toLowerCase();
        if (/mono|courier|consolas|code/.test(f)) return 'mono';
        if (/impact|oswald|bebas|anton|league gothic|archivo black|black ops/.test(f)) return 'display';
        if (/trebuchet|comfortaa|nunito|varela|quicksand|poppins|montserrat|raleway/.test(f)) return 'round';
        if (/serif/.test(f) && !/sans/.test(f)) return 'serif';
        if (/georgia|times|merriweather|playfair|lora|garamond|libre baskerville|pt serif/.test(f)) return 'serif';
        return 'sans';
    }
    function pictureSlide(png) {
        return { bg: '#000000', els: png ? [{ id: 'e1', type: 'image', src: png, fit: 'contain', x: 0, y: 0, w: 1280, h: 720, rot: 0 }] : [] };
    }
    function clipRect(el, base) {
        var ref = el.closest && el.closest('[clip-path]');
        if (!ref) return null;
        var m = /url\(\s*["']?#([^"')]+)/.exec(ref.getAttribute('clip-path') || '');
        var cp = m && ref.ownerSVGElement && ref.ownerSVGElement.getElementById ? ref.ownerSVGElement.getElementById(m[1]) : null;
        var shape = cp && cp.firstElementChild;
        if (!shape || !shape.getBBox) return null;
        try {
            var bb = shape.getBBox(), ctm = ref.getScreenCTM(), xs = [], ys = [];
            [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]].forEach(function (c) {
                xs.push(ctm.a * c[0] + ctm.c * c[1] + ctm.e - base.left);
                ys.push(ctm.b * c[0] + ctm.d * c[1] + ctm.f - base.top);
            });

    // ------------------------------------------------------------------ open

                for (var i = 0; i < r; i++) { var row = []; for (var j = 0; j < c; j++) row.push(''); cells.push(row); }
                var w = Math.min(1120, c * 180), h = Math.min(600, r * 56);
                addEl({ type: 'table', cells: cells, size: 20, color: '#1f2937', headFill: '#e8eaed', strokeColor: '#9aa0a6', x: Math.round(640 - w / 2), y: Math.round(360 - h / 2), w: w, h: h });

    // ------------------------------------------------------------------ video + phone photos + ClipZone
    function addVideo(v) {
        addEl(Object.assign({ type: 'video', x: 240, y: 135, w: 800, h: 450 }, v));
    }
    function parseYouTube(u) {
        u = String(u || '').trim();
        var m = /(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/i.exec(u);
        var vid = m ? m[1] : (/^[\w-]{11}$/.test(u) ? u : null);
        if (!vid) return null;
        var start = 0, tm = /[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?/.exec(u);
        if (tm) start = (Number(tm[1]) || 0) * 3600 + (Number(tm[2]) || 0) * 60 + (Number(tm[3]) || 0);
        return { vid: vid, start: start };
    }
    function youtubeDialog() {
        dialog({
            title: t('presento.v.ytTitle'), input: { value: '', max: 300, placeholder: 'https://www.youtube.com/watch?v=…' },
            hint: t('presento.v.ytHint'), ok: t('presento.i.insert'),
            run: function (v) {
                var y = parseYouTube(v);
                if (!y) return Promise.reject(new Error(t('presento.err.youtube')));
                addVideo({ src: 'youtube', vid: y.vid, start: y.start || undefined });
            },
        });
    }
    function clipPicker() {
        dialog({
            title: t('presento.v.clipTitle'), wide: true, noOk: true,
            html: '<div class="pick-search"><input type="text" id="clipQ" data-own-enter="1" placeholder="' + esc(t('presento.v.clipSearch')) + '"><button id="clipGo">' + esc(t('presento.v.search')) + '</button></div><div id="clipList"><div class="spinner"></div></div>',
            onOpen: function (body, close, setErr) {
                var list = body.querySelector('#clipList'), q = body.querySelector('#clipQ');
                function load() {
                    list.innerHTML = '<div class="spinner"></div>';
                    Site.call('clips', { q: q.value }).then(function (r) {
                        var clips = r.clips || [];
                        if (!clips.length) { list.innerHTML = '<div class="empty">' + esc(t('presento.v.noClips')) + '</div>'; return; }
                        list.innerHTML = '<div class="pick-grid">' + clips.map(function (c, i) {
                            var th = safeUrl(c.thumb);
                            return '<button class="pick" data-i="' + i + '">' + (th ? '<img src="' + esc(th) + '" alt="">' : '<div style="width:100%;height:100%;background:#111"></div>') +
                                '<span class="cap"><b>' + esc(c.title) + '</b>' + esc(c.channel || '') + '</span></button>';
                        }).join('') + '</div>';
                        list.querySelectorAll('.pick').forEach(function (b) {
                            b.onclick = function () {

    function phonePicker(mode) {

            html: '<div class="spinner"></div>',

    // ------------------------------------------------------------------ editing the selection
    function setProp(prop, val) {
        var el = selEl();
        if (!el) return;
        change(function () { if (val === undefined || val === null) delete el[prop]; else el[prop] = val; });
    }
    function deleteSel() {
        var el = selEl();
        if (!el) return;
        change(function () { var els = curData().els; els.splice(els.indexOf(el), 1); });
        E.sel = null; drawSel(); drawTools();
    }
    function duplicateSel() {
        var el = selEl();
        if (!el || !canAdd()) return;
        var c = clone(el); c.x += 20; c.y += 20;
        addEl(c);
    }
    function arrange(how) {
        var el = selEl();
        if (!el) return;
        change(function () {
            var els = curData().els, i = els.indexOf(el);
            els.splice(i, 1);
            if (how === 'front') els.push(el);
            else if (how === 'back') els.unshift(el);
            else if (how === 'forward') els.splice(Math.min(els.length, i + 1), 0, el);
            else els.splice(Math.max(0, i - 1), 0, el);
        });
    }
    function tableEdit(what) {
        var el = selEl();
        if (!el || el.type !== 'table') return;
        var rows = el.cells.length, cols = el.cells[0] ? el.cells[0].length : 0;
        if (what === 'rowAdd' && rows >= (E.cfg.maxTableRows || 12)) return toast(t('presento.err.tableMax'));
        if (what === 'colAdd' && cols >= (E.cfg.maxTableCols || 8)) return toast(t('presento.err.tableMax'));
        if ((what === 'rowDel' && rows <= 1) || (what === 'colDel' && cols <= 1)) return;
        change(function () {
            if (what === 'rowAdd') { el.cells.push(el.cells[0].map(function () { return ''; })); el.h = r1(el.h + el.h / rows); }
            if (what === 'rowDel') { el.cells.pop(); el.h = r1(Math.max(20, el.h - el.h / rows)); }
            if (what === 'colAdd') el.cells.forEach(function (r) { r.push(''); });
            if (what === 'colDel') el.cells.forEach(function (r) { r.pop(); });
        });
    }

    function palette(anchor, current, allowNone, cb) {
        var p = document.createElement('div');

        if (allowNone) h += '<button class="none" data-c="transparent">⃠ ' + esc(t('presento.c.none')) + '</button>';
        h += '<div class="sws">' + SWATCHES.map(function (c) {
            return '<button class="sw' + (String(current).toLowerCase() === c ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '" title="' + c + '"></button>';
        }).join('') + '</div>';
        h += '<div class="hex"><input type="text" maxlength="7" value="' + esc(/^#/.test(current || '') ? current : '#') + '"><button>' + esc(t('presento.d.ok')) + '</button></div>';
        p.innerHTML = h;
        p.addEventListener('click', function (e) {
            var b = e.target.closest('[data-c]');
            if (b) { closeMenu(); cb(b.getAttribute('data-c')); }
        });
        var inp = p.querySelector('.hex input');
        function applyHex() { var v = inp.value.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v) || /^#[0-9a-fA-F]{3}$/.test(v)) { closeMenu(); cb(v.toLowerCase()); } }
        p.querySelector('.hex button').onclick = applyHex;
        inp.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') applyHex(); });
        popup(anchor, p);
    }

    function wireTools() {
        var bar = $('edTools');
        bar.addEventListener('mousedown', function (e) { if (E && E.editing && e.target.closest('.tb')) e.preventDefault(); });  // keep typing focus
        bar.addEventListener('click', function (e) {
            var b = e.target.closest('[data-a]');
            if (!b || b.disabled || !E) return;
            var a = b.getAttribute('data-a'), el = selEl();
            if (E.editing && ['bold', 'italic', 'underline', 'color', 'tfill', 'align-left', 'align-center', 'align-right', 'align-justify'].indexOf(a) < 0) commitEditing();
            el = selEl();
            switch (a) {
                case 'undo': return undo();
                case 'redo': return redo();
                case 'addText': return addText();
                case 'addImage':
                    if (!E.cfg.phone) return imageDialog(false);
                    return menu(b, [
                        { label: t('presento.i.byLink'), run: function () { imageDialog(false); } },
                        { label: t('presento.i.fromPhone'), run: function () { phonePicker('image'); } }]);
                case 'addVideo': {
                    var vm = [{ label: t('presento.v.youtube'), run: youtubeDialog }];
                    if (E.cfg.clipzone) vm.push({ label: t('presento.v.clipzone'), run: clipPicker });
                    if (E.cfg.phone) vm.push({ label: t('presento.v.phone'), run: function () { phonePicker('video'); } });
                    return menu(b, vm);
                }
                case 'preview': E.preview = E.preview === (el && el.id) ? null : (el && el.id); drawCanvas(); return drawTools();
                case 'addTable': return tableDialog();
                case 'addShape': return menu(b, [
                    { label: t('presento.sh.rect'), run: function () { addShape('rect'); } },
                    { label: t('presento.sh.round'), run: function () { addShape('round'); } },
                    { label: t('presento.sh.ellipse'), run: function () { addShape('ellipse'); } }]);
                case 'addLine': return menu(b, [
                    { label: t('presento.ln.line'), run: function () { addLine(false); } },
                    { label: t('presento.ln.arrow'), run: function () { addLine(true); } }]);
                case 'bg': return palette(b, curData().bg, false, function (c) { change(function () { curData().bg = c; }); });
                case 'layoutMenu': return layoutMenu(b);
                case 'theme': return themePicker(b);
                case 'transAll': {
                    var tr = curData().trans;
                    commitEditing(); beginChange();
                    E.slides.forEach(function (sl) { if (sl.data.trans !== tr) { if (tr) sl.data.trans = tr; else delete sl.data.trans; E.dirty[sl.sid] = true; } });
                    schedule(); syncUndo();
                    return toast(t('presento.tr.applied'));
                }
                case 'imgReplace': return imageDialog(true);
                case 'arrange': return menu(b, [
                    { label: t('presento.ar.front'), run: function () { arrange('front'); } },
                    { label: t('presento.ar.forward'), run: function () { arrange('forward'); } },
                    { label: t('presento.ar.backward'), run: function () { arrange('backward'); } },
                    { label: t('presento.ar.back'), run: function () { arrange('back'); } }]);
                case 'dup': return duplicateSel();
                case 'del': return deleteSel();
                case 'rowAdd': case 'rowDel': case 'colAdd': case 'colDel': return tableEdit(a);
            }
            if (!el) return;
            var editing = E.editing === el.id;
            function set(prop, val) {
                if (editing) commitEditing();
                setProp(prop, val);
                if (editing) startEditing(el.id);
            }
            switch (a) {
                case 'bold': case 'italic': case 'underline': return set(a, el[a] ? undefined : true);
                case 'align-left': case 'align-center': case 'align-right': case 'align-justify': return set('align', a.slice(6));
                case 'color': return palette(b, el.color, false, function (c) { set('color', c); });
                case 'tfill': return palette(b, el.fill, true, function (c) { set('fill', c === 'transparent' ? undefined : c); });
                case 'fill': return palette(b, el.fill, true, function (c) { setProp('fill', c); });
                case 'strokeColor': return palette(b, el.strokeColor, false, function (c) { setProp('strokeColor', c); if (el.type === 'shape' && !el.stroke) setProp('stroke', 2); });
                case 'lineColor': return palette(b, el.color, false, function (c) { setProp('color', c); });
                case 'headFill': return palette(b, el.headFill, true, function (c) { setProp('headFill', c); });
                case 'arrow': return setProp('arrow', el.arrow ? undefined : true);
                case 'muted': return setProp('muted', el.muted ? undefined : true);
                case 'loop': return setProp('loop', el.loop ? undefined : true);
            }
        });
        bar.addEventListener('change', function (e) {
            var s = e.target.getAttribute && e.target.getAttribute('data-s');
            if (s === 'trans') { var tv = e.target.value; return change(function () { if (tv) curData().trans = tv; else delete curData().trans; }); }
            if (!s || !selEl()) return;
            var v = e.target.value;
            if (s === 'anim') {
                var ae = selEl();
                return change(function () {
                    if (!v) { delete ae.anim; delete ae.step; return; }
                    if (!ae.anim) { var mx = 0; curData().els.forEach(function (x) { if (x.anim && x !== ae) mx = Math.max(mx, x.step || 1); }); ae.step = Math.min(20, mx + 1); }
                    ae.anim = v;
                });
            }
            if (s === 'step') v = Math.max(1, Math.min(20, Number(v) || 1));
            if (s === 'size' || s === 'stroke' || s === 'start') {
                v = Number(v);
                if (!isFinite(v)) return drawTools();
                v = s === 'size' ? Math.max(6, Math.min(300, Math.round(v))) : s === 'start' ? Math.max(0, Math.min(86400, Math.round(v))) : Math.max(0, Math.min(40, v));
                if (s === 'stroke' && selEl().type === 'line') v = Math.max(1, v);
            }
            setProp(s, v);
        });
        bar.addEventListener('keydown', function (e) { if (e.target.tagName === 'INPUT' && e.key === 'Enter') e.target.blur(); });
    }

    // ------------------------------------------------------------------ slide strip
    function drawStrip() {
        var st = $('edStrip');
        if (!st || !E) return;
        var h = E.ro ? '' : '<div class="st-add"><button data-sa="new">' + EI.plus + esc(t('presento.tb.newSlide')) + '</button><button data-sa="layouts">' + EI.down + '</button></div>';
        h += E.slides.map(function (s, i) {
            return '<div class="st' + (i === E.cur ? ' on' : '') + '" data-i="' + i + '"' + (E.ro ? '' : ' draggable="true"') + '><span class="n">' + (i + 1) + '</span><div class="pv"></div></div>';
        }).join('');
        st.innerHTML = h;
        E.slides.forEach(function (s, i) { refreshThumb(i); });
        var on = st.querySelector('.st.on');
        if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
    }
    function refreshThumb(i) {
        var box = document.querySelector('#edStrip .st[data-i="' + i + '"] .pv');
        if (!box || !E.slides[i]) return;
        box.innerHTML = '';
        renderSlide(E.slides[i].data, box);
    }
    function goSlide(i) {
        if (!E || i < 0 || i >= E.slides.length) return;
        commitEditing();
        E.cur = i; E.sel = null; E.preview = null;
        document.querySelectorAll('#edStrip .st').forEach(function (n) { n.classList.toggle('on', Number(n.getAttribute('data-i')) === i); });
        var on = document.querySelector('#edStrip .st.on');
        if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
        drawCanvas(); drawTools();
    }
    function slideChange(fn) {
        commitEditing();
        beginChange();
        fn();
        E.orderDirty = true;
        E.sel = null;
        schedule();
        drawStrip(); drawCanvas(); drawTools();
    }
    function newSlide(kind) {
        if (E.slides.length >= (E.cfg.maxSlides || 50)) return toast(t('presento.err.tooManySlides', E.cfg.maxSlides || 50));
        slideChange(function () {
            var s = { sid: uid('s'), data: layout(kind, curData().bg) };
            if (curData().trans) s.data.trans = curData().trans;
            E.slides.splice(E.cur + 1, 0, s);
            E.cur++;
            E.dirty[s.sid] = true;
        });
    }
    function dupSlide(i) {
        if (E.slides.length >= (E.cfg.maxSlides || 50)) return toast(t('presento.err.tooManySlides', E.cfg.maxSlides || 50));
        slideChange(function () {
            var s = { sid: uid('s'), data: clone(E.slides[i].data) };
            E.slides.splice(i + 1, 0, s);
            E.cur = i + 1;
            E.dirty[s.sid] = true;
        });
    }
    function delSlide(i) {
        if (E.slides.length <= 1) return toast(t('presento.err.lastSlide'));
        slideChange(function () {
            E.slides.splice(i, 1);
            if (E.cur >= E.slides.length) E.cur = E.slides.length - 1;
            else if (E.cur > i) E.cur--;
        });
    }
    function moveSlide(from, to) {
        if (from === to || to < 0 || to >= E.slides.length) return;
        slideChange(function () {
            var s = E.slides.splice(from, 1)[0];
            E.slides.splice(to, 0, s);
            E.cur = to;
        });
    }
    function layoutMenu(anchor) {
        menu(anchor, LAYOUTS.map(function (k) { return { label: t('presento.lay.' + k), run: function () { newSlide(k); } }; }));
    }
    function slideMenu(i, at) {
        menu(null, [
            { label: t('presento.sl.new'), run: function () { goSlide(i); newSlide('body'); } },
            { label: t('presento.sl.dup'), run: function () { dupSlide(i); } },
            '-',
            { label: t('presento.sl.up'), disabled: i === 0, run: function () { moveSlide(i, i - 1); } },
            { label: t('presento.sl.down'), disabled: i === E.slides.length - 1, run: function () { moveSlide(i, i + 1); } },
            '-',
            { label: t('presento.sl.del'), danger: true, disabled: E.slides.length <= 1, run: function () { delSlide(i); } },
        ], at);
    }
    function wireStrip() {
        var st = $('edStrip'), dragFrom = null;
        st.addEventListener('click', function (e) {
            var sa = e.target.closest('[data-sa]');
            if (sa) { if (sa.getAttribute('data-sa') === 'new') newSlide('body'); else layoutMenu(sa); return; }
            var it = e.target.closest('.st');
            if (it) goSlide(Number(it.getAttribute('data-i')));
        });
        if (E.ro) return;
        st.addEventListener('contextmenu', function (e) {
            var it = e.target.closest('.st');
            if (!it) return;
            e.preventDefault();
            var i = Number(it.getAttribute('data-i'));
            goSlide(i);
            slideMenu(i, { x: e.clientX, y: e.clientY });
        });
        st.addEventListener('dragstart', function (e) {
            var it = e.target.closest('.st');
            if (!it) return;
            dragFrom = Number(it.getAttribute('data-i'));
            try { e.dataTransfer.setData('text/plain', String(dragFrom)); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* ignore */ }
        });
        function clearMarks() { st.querySelectorAll('.dropA,.dropB').forEach(function (n) { n.classList.remove('dropA', 'dropB'); }); }
        st.addEventListener('dragover', function (e) {
            var it = e.target.closest('.st');
            if (dragFrom == null || !it) return;
            e.preventDefault();
            clearMarks();
            var r = it.getBoundingClientRect();
            it.classList.add(e.clientY < r.top + r.height / 2 ? 'dropB' : 'dropA');
        });
        st.addEventListener('dragleave', function (e) { if (!st.contains(e.relatedTarget)) clearMarks(); });
        st.addEventListener('drop', function (e) {
            var it = e.target.closest('.st');
            if (dragFrom == null || !it) return;
            e.preventDefault();
            var i = Number(it.getAttribute('data-i')), after = it.classList.contains('dropA');
            clearMarks();
            var to = i + (after ? 1 : 0);
            if (to > dragFrom) to--;
            var from = dragFrom;
            dragFrom = null;
            moveSlide(from, to);
        });
        st.addEventListener('dragend', function () { dragFrom = null; clearMarks(); });
    }

    // ================================================================== casting to in-game TVs (as-computer)
    // The TV follows this page while presenting: every slide / click step is sent with castGo. The presenter can
    // also walk up to the TV and use the clicker keys (Page Down / Page Up by default); the cast keeps running
    // after present mode closes, until it is stopped, the presenter leaves, or nobody moves it on for a while.
    function castSync() {
        if (!E || !E.cast || !PR || PR.end) return;
        var key = PR.i + ':' + PR.step;
        if (E.cast.sent === key) return;
        E.cast.sent = key;
        Site.call('castGo', { tv: E.cast.tv, slide: PR.i + 1, step: PR.step }).catch(function (e) { toast(e.message); });
    }
    function castStart(tv) {
        var slide = (PR ? PR.i : E.cur) + 1, step = PR ? PR.step : 0;
        return Site.call('castStart', { id: E.deck.id, tv: tv.id, slide: slide, step: step }).then(function () {
            if (!PR) present(E.cur);   // before E.cast is set, so present() doesn't send castStart a second time
            E.cast = { tv: tv.id, label: tv.label, sent: (slide - 1) + ':' + step };
            toast(t('presento.c5.started', tv.label));
            prCastUi();
        });
    }
    function castStop() {
        if (!E || !E.cast) return;
        var tv = E.cast.tv;
        E.cast = null;
        prCastUi();
        Site.call('castStop', { tv: tv }).then(function () { toast(t('presento.c5.stopped')); }, function (e) { toast(e.message); });
    }
    function prCastUi() {
        var b = document.querySelector('.pr-bar [data-p=cast]');
        if (b) b.classList.toggle('on', !!(E && E.cast));
    }
    function castDialog() {
        dialog({
            title: t('presento.c5.title'), noOk: true, html: '<div class="spinner"></div>',
            onOpen: function (body, close, setErr) {

                    var tvs = r.tvs || [], h = '';
                    if (E.cast) h += '<div class="sh-row"><span class="av">📺</span><div class="grow"><b>' + esc(t('presento.c5.showing', E.cast.label)) + '</b></div><button class="sh-btn" id="castStop">' + esc(t('presento.c5.stop')) + '</button></div>';
                    if (!tvs.length) h += '<div class="empty">' + esc(t('presento.c5.none')) + '</div>';
                    else h += '<div class="sh-list">' + tvs.map(function (v, i) {
                        var note = v.mine ? t('presento.c5.mine') : v.busy ? t('presento.c5.busy', v.showing || '') : '';
                        return '<div class="sh-row"><span class="av">📺</span><div class="grow"><b>' + esc(v.label) + '</b><small>' + esc(t('presento.c5.dist', Math.round(v.dist))) + (note ? ' · ' + esc(note) : '') + '</small></div>' +
                            '<button class="sh-btn" data-tv="' + i + '"' + (v.busy ? ' disabled' : '') + '>' + esc(t('presento.c5.show')) + '</button></div>';
                    }).join('') + '</div>';
                    h += '<div class="sh-hint">' + esc(t('presento.c5.hint')) + '</div>';
                    body.innerHTML = h;
                    var st = body.querySelector('#castStop');
                    if (st) st.onclick = function () { close(); castStop(); };

                        b.onclick = function () {

                            castStart(tvs[Number(b.getAttribute('data-tv'))]).then(close, function (e) { b.disabled = false; setErr(e.message); });
