    // ================================================================== present mode
    // Full screen inside the Scout window. Next: click, Space, Enter, Right, Down, Page Down.
    // Back: Left, Up, Page Up, Backspace. Esc leaves. Elements with an animation appear one click step at a time.
    var PR = null;
    function animSteps(slide) {
        var seen = {};
        (slide.els || []).forEach(function (e) { if (e.anim) seen[e.step || 1] = true; });
        return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
    }
    function present(from) {
        if (!E || PR) return;
        commitEditing();
        E.preview = null;
        var root = document.createElement('div');
        root.className = 'pr';
        root.innerHTML = '<div class="pr-stage" id="prStage"></div>' +
            '<div class="pr-bar" id="prBar"><button data-p="prev" title="' + esc(t('presento.p.prev')) + '">‹</button><span id="prCount"></span>' +
            '<button data-p="next" title="' + esc(t('presento.p.next')) + '">›</button><span class="pr-sep"></span>' +
            (E.cfg.cast ? '<button data-p="cast" title="' + esc(t('presento.c5.menu')) + '">📺</button>' : '') +
            '<button data-p="exit" title="' + esc(t('presento.p.exit')) + '">✕ ' + esc(t('presento.p.exit')) + '</button></div>';
        document.body.appendChild(root);
        PR = { root: root, slides: clone(E.slides.map(function (s) { return s.data; })), i: -1, step: 0, cur: null, hideT: null, end: false };
        root.addEventListener('click', function (e) {
            var b = e.target.closest('[data-p]');
            if (b) { e.stopPropagation(); var a = b.getAttribute('data-p'); if (a === 'prev') prPrev(); else if (a === 'next') prNext(); else if (a === 'cast') castDialog(); else prExit(); return; }
            if (e.target.closest('video,iframe')) return;
            prNext();
        });
        root.addEventListener('contextmenu', function (e) { e.preventDefault(); prPrev(); });
        root.addEventListener('mousemove', function () {
            root.classList.add('ui');
            clearTimeout(PR && PR.hideT);
            if (PR) PR.hideT = setTimeout(function () { if (PR) PR.root.classList.remove('ui'); }, 2200);
        });
        PR.onResize = function () { if (PR && !PR.end) prShow(PR.i, 0, PR.step); };
        window.addEventListener('resize', PR.onResize);
        var first = Math.max(0, Math.min(from || 0, PR.slides.length - 1));
        if (E.cast) {   // already showing on a TV: send the latest slides and start where we are
            E.cast.sent = first + ':0';
            Site.call('castStart', { id: E.deck.id, tv: E.cast.tv, slide: first + 1, step: 0 }).catch(function (e) { toast(e.message); E.cast = null; prCastUi(); });
        }
        prShow(first, 0, 0);
        prCastUi();
    }
    function prFit() {
        var st = document.getElementById('prStage');
        return Math.min(st.clientWidth / 1280, st.clientHeight / 720);
    }
    // Draw slide i. dir = 1 forward, -1 back, 0 no transition. revealed = how many click steps are already shown.
    function prShow(i, dir, revealed) {
        var st = document.getElementById('prStage'), sc = prFit(), data = PR.slides[i];
        var wrap = document.createElement('div');
        wrap.className = 'pr-slide';
        wrap.style.width = Math.round(1280 * sc) + 'px';
        wrap.style.height = Math.round(720 * sc) + 'px';
        var s = renderSlide(data, wrap, { scale: sc, live: true });
        var steps = animSteps(data);
        (data.els || []).forEach(function (e) {
            if (!e.anim) return;
            var idx = steps.indexOf(e.step || 1);
            if (idx >= revealed) { var n = s.querySelector('[data-id="' + e.id + '"]'); if (n) { n.style.visibility = 'hidden'; prPause(n); } }
        });
        var old = PR.cur;
        st.appendChild(wrap);
        if (dir && data.trans) {
            wrap.classList.add('tr-' + data.trans);
            if (dir < 0) wrap.classList.add('back');
            setTimeout(function () { if (old) old.remove(); }, 650);
        } else if (old) old.remove();
        if (old) prPauseAll(old);
        PR.cur = wrap; PR.i = i; PR.step = revealed; PR.steps = steps; PR.end = false;
        document.getElementById('prCount').textContent = (i + 1) + ' / ' + PR.slides.length;
        castSync();
    }
    function prPause(n) {
        if (n.tagName === 'VIDEO') { try { n.pause(); n.autoplay = false; } catch (e) { /* ignore */ } }
        if (n.tagName === 'IFRAME') { n.dataset.src = n.src; n.src = 'about:blank'; }
    }
    function prPauseAll(root) { root.querySelectorAll('video,iframe').forEach(prPause); }
    var FLY = { fade: [0, 0, 1], left: [-420, 0, 1], right: [420, 0, 1], up: [0, 300, 1], zoom: [0, 0, 0.3] };
    function prReveal(stepNo, animate) {
        (PR.slides[PR.i].els || []).forEach(function (e) {
            if (!e.anim || (e.step || 1) !== stepNo) return;
            var n = PR.cur.querySelector('[data-id="' + e.id + '"]');
            if (!n) return;
            n.style.visibility = '';
            if (n.tagName === 'VIDEO') { try { n.play(); } catch (x) { /* ignore */ } }
            if (n.tagName === 'IFRAME' && n.dataset.src) n.src = n.dataset.src;
            if (!animate || !n.animate) return;
            var f = FLY[e.anim] || FLY.fade, base = n.style.transform || '';
            n.animate([
                { opacity: 0, transform: 'translate(' + f[0] + 'px,' + f[1] + 'px) scale(' + f[2] + ') ' + base },
                { opacity: 1, transform: 'translate(0,0) scale(1) ' + base },
            ], { duration: 550, easing: 'cubic-bezier(.2,.7,.2,1)' });
        });
    }
    function prNext() {
        if (!PR) return;
        if (PR.end) return prExit();
        if (PR.step < PR.steps.length) { prReveal(PR.steps[PR.step], true); PR.step++; castSync(); return; }
        if (PR.i < PR.slides.length - 1) return prShow(PR.i + 1, 1, 0);
        // end screen
        prPauseAll(PR.cur);
        PR.cur.remove();
        var endEl = document.createElement('div');
        endEl.className = 'pr-end';
        endEl.textContent = t('presento.p.end');
        document.getElementById('prStage').appendChild(endEl);
        PR.cur = endEl; PR.end = true;
    }
    function prPrev() {
        if (!PR) return;
        if (PR.end) return prShow(PR.i, 0, PR.steps.length);
        if (PR.step > 0) {
            PR.step--;
            var stepNo = PR.steps[PR.step];
            (PR.slides[PR.i].els || []).forEach(function (e) {
                if (!e.anim || (e.step || 1) !== stepNo) return;
                var n = PR.cur.querySelector('[data-id="' + e.id + '"]');
                if (n) { n.style.visibility = 'hidden'; prPause(n); }
            });
            castSync();
            return;
        }
        if (PR.i > 0) prShow(PR.i - 1, -1, animSteps(PR.slides[PR.i - 1]).length);
    }
    function prGo(i) { if (PR && i >= 0 && i < PR.slides.length) prShow(i, 0, 0); }
    function prExit() {
        if (!PR) return;
        var i = PR.i;
        prPauseAll(PR.root);
        window.removeEventListener('resize', PR.onResize);
        clearTimeout(PR.hideT);
        PR.root.remove();
        PR = null;
        if (E) goSlide(Math.min(i, E.slides.length - 1));
    }
    document.addEventListener('keydown', function (e) {
        if (!PR || document.querySelector('.scrim')) return;
        var k = e.key;
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n', 'N'].indexOf(k) >= 0) { e.preventDefault(); prNext(); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].indexOf(k) >= 0) { e.preventDefault(); prPrev(); }
        else if (k === 'Home') { e.preventDefault(); prGo(0); }
        else if (k === 'End') { e.preventDefault(); prGo(PR.slides.length - 1); }
        else if (k === 'Escape') { e.preventDefault(); prExit(); }
        e.stopImmediatePropagation();
    }, true);

    // ================================================================== themes
    var THEMES = {
        default:   { bg: '#ffffff', tf: 'sans',    tc: '#1f2937', bf: 'sans',  bc: '#4b5563', sc: '#6b7280', accent: '#ff7a1a' },
        dark:      { bg: '#16181d', tf: 'sans',    tc: '#ffffff', bf: 'sans',  bc: '#c9ced6', sc: '#9aa3b0', accent: '#ff8a33' },
        police:    { bg: '#0b1f44', tf: 'sans',    tc: '#ffffff', bf: 'sans',  bc: '#cfd8e8', sc: '#cfd8e8', accent: '#3d8bfd' },
        medical:   { bg: '#f4fbfb', tf: 'sans',    tc: '#0f5257', bf: 'sans',  bc: '#35565a', sc: '#35565a', accent: '#d93a3a' },
        corporate: { bg: '#f5f6f8', tf: 'serif',   tc: '#1d2a3a', bf: 'sans',  bc: '#46505e', sc: '#46505e', accent: '#e8742a' },
        bold:      { bg: '#111111', tf: 'display', tc: '#ffd400', bf: 'sans',  bc: '#f2f2f2', sc: '#f2f2f2', accent: '#ffd400' },
        retro:     { bg: '#2b1055', tf: 'display', tc: '#ff5fd2', bf: 'round', bc: '#7ef9ff', sc: '#7ef9ff', accent: '#ffe45e' },
        paper:     { bg: '#fbf6ea', tf: 'serif',   tc: '#3b2f22', bf: 'serif', bc: '#5b4a37', sc: '#5b4a37', accent: '#a4502a' },
    };
    function theme() { return THEMES[E && E.deck.theme] || THEMES.default; }
    function applyTheme(key) {
        var th = THEMES[key];
        if (!th) return;
        commitEditing();
        beginChange();
        E.slides.forEach(function (s) {
            s.data.bg = th.bg;
            s.data.els.forEach(function (e) {
                if (e.type !== 'text' || !e.ph) return;
                if (e.ph === 'title') { e.font = th.tf; e.color = th.tc; }
                else if (e.ph === 'subtitle') { e.font = th.bf; e.color = th.sc; }
                else { e.font = th.bf; e.color = th.bc; }
            });
            E.dirty[s.sid] = true;
        });
        E.deck.theme = key;
        schedule();
        syncUndo();
        drawStrip(); drawCanvas(); drawTools();
        Site.call('setTheme', { id: E.deck.id, theme: key }).catch(function (e) { toast(e.message); });
    }
    function themePicker(anchor) {
        var p = document.createElement('div');
        p.className = 'thp';
        p.innerHTML = Object.keys(THEMES).map(function (k) {
            var th = THEMES[k];
            return '<button class="thc' + ((E.deck.theme || 'default') === k ? ' on' : '') + '" data-th="' + k + '"><span class="sw" style="background:' + th.bg + '">' +
                '<b style="color:' + th.tc + ';font-family:' + FONTS[th.tf] + '">Aa</b><i style="background:' + th.accent + '"></i></span>' + esc(t('presento.th.' + k)) + '</button>';
        }).join('');
        p.addEventListener('click', function (e) { var b = e.target.closest('[data-th]'); if (b) { closeMenu(); applyTheme(b.getAttribute('data-th')); } });
        popup(anchor, p);
    }

    // ------------------------------------------------------------------ keyboard
    var lastNudge = 0;
    document.addEventListener('keydown', function (e) {
        if (!E || PR || document.querySelector('.scrim')) return;
        var k = e.key, mod = e.ctrlKey || e.metaKey, field = isField(e.target);
        if (mod && k === 'Enter' && !field) { e.preventDefault(); present(e.shiftKey ? 0 : E.cur); return; }
        if (E.ro) {
            if (!field && (k === 'ArrowDown' || k === 'PageDown')) { e.preventDefault(); goSlide(E.cur + 1); }
            if (!field && (k === 'ArrowUp' || k === 'PageUp')) { e.preventDefault(); goSlide(E.cur - 1); }
            return;
        }
        if (mod && (k === 'z' || k === 'Z') && !field) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
        if (mod && (k === 'y' || k === 'Y') && !field) { e.preventDefault(); redo(); return; }
        if (field) {
            if (k === 'Escape' && E.editing) { e.preventDefault(); e.target.blur(); }
            return;
        }
        var el = selEl();
        if (mod && (k === 'm' || k === 'M')) { e.preventDefault(); newSlide('body'); return; }
        if (mod && (k === 'v' || k === 'V') && E.clip) {
            e.preventDefault();
            var c = clone(E.clip); c.x += 20; c.y += 20; E.clip = clone(c);
            addEl(c);
            return;
        }
        if (!el) {
            if (k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); goSlide(E.cur + 1); }
            if (k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); goSlide(E.cur - 1); }
            return;
        }
        if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); deleteSel(); return; }
        if (k === 'Escape') { select(null); return; }
        if (k === 'Enter' && (el.type === 'text' || el.type === 'table')) { e.preventDefault(); startEditing(el.id); return; }
        if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); duplicateSel(); return; }
        if (mod && (k === 'c' || k === 'C')) { e.preventDefault(); E.clip = clone(el); toast(t('presento.t.copiedEl')); return; }
        if (mod && (k === 'x' || k === 'X')) { e.preventDefault(); E.clip = clone(el); deleteSel(); return; }
        var step = e.shiftKey ? 10 : 1, d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[k];
        if (d) {
            e.preventDefault();
            if (Date.now() - lastNudge > 700) beginChange();
            lastNudge = Date.now();
            el.x = r1(el.x + d[0]); el.y = r1(el.y + d[1]);
            redrawEl(el);
            touched();
        }
    });

    // ------------------------------------------------------------------ routes
    //   /                recent          /mine            my presentations (root)
    //   /mine/<folder>   one folder      /shared          shared with me
    //   /search/<q>      search          /d/<id>          open a deck
    Site.onRoute(function (path) {
        closeMenu();
        var parts = path.split('/').filter(Boolean);
        if (E && !(parts[0] === 'd' && parts[1] === E.deck.id)) leaveEditor();
        if (parts[0] === 'd' && parts[1]) { if (E && E.deck.id === parts[1]) return; return loadDeck(parts[1]); }
        if (parts[0] === 'v' && parts[1]) {
            app.innerHTML = '<div class="spinner"></div>';
            return Site.call('linkOpen', { token: parts[1] }).then(function (r) { Site.go('/d/' + r.id); }, function (e) {
                app.innerHTML = topBar('') + '<div class="inner"><div class="empty"><div class="big">🔗</div>' + esc(e.message) + '</div></div>';
                wireTop();
            });
        }
        S.q = ''; S.folder = null; S.view = 'recent';
        if (parts[0] === 'mine') { S.view = 'mine'; S.folder = parts[1] ? Number(parts[1]) || null : null; }
        else if (parts[0] === 'shared') S.view = 'shared';
        else if (parts[0] === 'search' && parts[1]) { try { S.q = decodeURIComponent(parts[1]); } catch (e) { S.q = parts[1]; } }
        loadHome();
    });
})();
</script>
