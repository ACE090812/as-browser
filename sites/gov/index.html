<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los Santos Government</title>
<link rel="stylesheet" href="/sdk/site.css">
<style>
    :root { --accent: #1d70b8; --accent-fg: #fff; --gov: #0b0c0c; --focus: #ffdd00; }
    :root[data-theme="dark"] { --accent: #6bb3f5; --accent-fg: #06121f; --gov: #000; }
    body { font-size: 16px; }
    .top { background: var(--gov); color: #fff; padding: 10px 16px; border-bottom: 10px solid var(--accent); }
    .top .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; cursor: pointer; }
    .top svg { width: 30px; height: 30px; flex: 0 0 auto; }
    .top .sub { font-weight: 400; font-size: 12.5px; opacity: .75; display: block; }
    .banner { background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 16px; font-size: 13px; color: var(--muted); }
    .crumbs { padding: 12px 16px 0; font-size: 14px; }
    .crumbs a { text-decoration: underline; }
    .crumbs span { color: var(--muted); }
    .page { padding: 16px; max-width: 640px; margin: 0 auto; }
    h1 { font-size: 30px; font-weight: 800; margin-bottom: 14px; }
    h2 { font-size: 22px; font-weight: 800; margin: 22px 0 10px; }
    .lead { font-size: 18px; color: var(--muted); }
    .glink { color: var(--accent); text-decoration: underline; font-weight: 600; cursor: pointer; display: block; text-align: left; }
    .glist > * { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .glist .desc { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
    .gbtn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 22px; background: #00703c; color: #fff; font-weight: 700; font-size: 17px; border-radius: 0; box-shadow: 0 2px 0 #002d18; }
    .gbtn:active { transform: translateY(2px); box-shadow: none; }
    .gbtn:disabled { opacity: .55; }
    .gbtn.block { display: flex; width: 100%; }
    .gbtn.grey { background: var(--surface-2); color: var(--fg); box-shadow: 0 2px 0 var(--line); }
    input:focus, select:focus, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; box-shadow: none; }
    .search { display: flex; }
    .search input { border-radius: 0; border: 2px solid var(--fg); }
    .search button { flex: 0 0 54px; background: var(--accent); color: var(--accent-fg); font-size: 18px; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { background: var(--surface); padding: 14px 12px; border-top: 4px solid var(--accent); text-align: left; }
    .tile b { display: block; font-size: 15.5px; margin: 4px 0 2px; }
    .tile span { font-size: 13px; color: var(--muted); }
    .tile .ic { font-size: 22px; }
    .plate { display: inline-flex; align-items: stretch; border-radius: 6px; overflow: hidden; border: 2px solid #111; background: #f7d117; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
    .plate .gb { background: #0a3d91; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 6px; display: flex; align-items: flex-end; }
    .plate .reg { color: #111; font-family: "Arial Black", Impact, Arial, sans-serif; font-weight: 900; font-size: 30px; letter-spacing: .06em; padding: 4px 14px; text-transform: uppercase; }
    .plate.small .reg { font-size: 20px; padding: 2px 10px; }
    .plate.small .gb { font-size: 8px; padding: 2px 4px; }
    .status { padding: 16px; margin: 12px 0; border-left: 10px solid var(--line); background: var(--surface); }
    .status.good { border-color: #00703c; }
    .status.bad { border-color: #d4351c; }
    .status.warn { border-color: #f47738; }
    .status h3 { font-size: 20px; margin: 0 0 4px; }
    .status .k { font-size: 14px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
    .panel { border: 4px solid var(--accent); padding: 16px; margin: 12px 0; }
    .vrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .veh { padding: 14px; background: var(--surface); margin-bottom: 10px; }
    .veh .meta { color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
    .receipt { text-align: center; background: #00703c; color: #fff; padding: 26px 16px; margin-bottom: 14px; }
    .receipt h1 { color: #fff; margin: 0 0 6px; }
    .foot { margin-top: 34px; padding: 16px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 13px; }
    .foot b { color: var(--fg); }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .opt { min-height: 46px; padding: 6px 14px; background: var(--surface); border: 2px solid var(--line); color: var(--fg); font-weight: 700; font-size: 15.5px; text-align: center; line-height: 1.25; }
    .opt small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
    .opt.on { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .opt.on small { color: inherit; }
    .opt:disabled { opacity: .4; }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .fine { font-size: 13.5px; color: var(--muted); }
    .meter { height: 12px; background: var(--surface-2); margin: 10px 0 6px; }
    .meter i { display: block; height: 100%; background: #00703c; }
    .meter i.warn { background: #f47738; }
    .meter i.bad { background: #d4351c; }
    .chk { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .chk .ic { flex: 0 0 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; background: var(--muted); }
    .chk.pass .ic { background: #00703c; }
    .chk.warn .ic { background: #f47738; }
    .chk.fail .ic { background: #d4351c; }
    .chk .desc { color: var(--muted); font-size: 14.5px; margin-top: 2px; }
    .paper { border: 3px double var(--fg); padding: 16px; margin: 12px 0; background: var(--surface); }
    .paper .ptitle { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .paper .pnum { font-size: 22px; font-weight: 800; letter-spacing: .04em; margin: 4px 0 10px; word-break: break-all; }
    .bigin { text-transform: uppercase; font-size: 24px; font-weight: 800; letter-spacing: .06em; max-width: 300px; border: 2px solid var(--fg); border-radius: 0; }
</style>
</head>
<body>
<div class="top">
    <div class="brand" data-go="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 4 6v9c0 7 5 12 12 15 7-3 12-8 12-15V6z" fill="#fff"/><path d="M16 6 8 9v6c0 4.6 3.2 8 8 10.2 4.8-2.2 8-5.6 8-10.2V9z" fill="#0b0c0c"/><path d="M16 9l1.6 3.4 3.7.4-2.8 2.5.8 3.6L16 17.100l-3.300 1.800.8-3.600-2.800-2.500 3.700-.4z" fill="#fff"/></svg>
        <div><span id="govName">Los Santos Government</span><span class="sub">lsgov.co.uk</span></div>
    </div>
</div>
<div class="banner" data-i18n="gov.banner">A fictional service for the Life In The 90s server. Not connected to any real government.</div>
<div class="crumbs" id="crumbs"></div>
<div class="page" id="app"><div class="spinner"></div></div>
<div class="foot" id="foot"><b>Los Santos Government</b><br>Roleplay use only</div>

<script src="/sdk/site.js"></script>
<script>
(function () {
    var esc = Site.esc;
    var home = null;              // { name, categories, services, mot, tax }
    var app = document.getElementById('app');
    var crumbsEl = document.getElementById('crumbs');
    var token = 0;                // drops results of a page the player already left
    var garage = null;            // cached myVehicles result
    var receipt = null;           // last tax receipt

    // ------------------------------------------------------------------ helpers

    function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
    function findService(id) { return byId(home.services, id); }
    function findCat(id) { return byId(home.categories, id); }
    function plateKey(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
    function plateHtml(p, small) {
        return '<span class="plate' + (small ? ' small' : '') + '"><span class="gb">GB</span><span class="reg">' + esc(p) + '</span></span>';
    }
    function crumbs(items) {
        crumbsEl.innerHTML = items.map(function (c, i) {
            return c.go ? '<a data-go="' + esc(c.go) + '">' + esc(c.t) + '</a>' : '<span>' + esc(c.t) + '</span>';
        }).join(' <span>›</span> ');
    }
    function setPage(title, html, trail) {
        Site.title(title + ' – ' + (home ? home.name : 'Los Santos Government'));
        crumbs(trail || []);
        app.innerHTML = html;
        window.scrollTo(0, 0);
    }
    function loading() { app.innerHTML = '<div class="spinner"></div>'; }
    function failure(e) {
        app.innerHTML = '<div class="notice bad">' + esc(e && e.message ? e.message : t('gov.error')) + '</div>' +
            '<p style="margin-top:14px"><a class="glink" data-go="/">' + esc(t('gov.backHome')) + '</a></p>';
    }
    function days(ts, now) { return Math.ceil((ts - now) / 86400); }

    // ------------------------------------------------------------------ pages

    function pHome() {
        var popular = home.services.filter(function (s) { return s.popular; });
        setPage(t('gov.home'),
            '<h1>' + esc(home.name) + '</h1>' +
            '<p class="lead">' + esc(t('gov.home.lead')) + '</p>' +
            '<form class="search" id="q"><input type="search" id="qi" placeholder="' + esc(t('gov.search.placeholder')) + '" aria-label="' + esc(t('gov.search.placeholder')) + '"><button type="submit" aria-label="' + esc(t('gov.search.button')) + '">&#128269;</button></form>' +
            '<h2>' + esc(t('gov.popular')) + '</h2><div class="glist">' +
            popular.map(function (s) { return '<div><a class="glink" data-go="' + esc(s.path) + '">' + esc(s.title) + '</a><div class="desc">' + esc(s.description) + '</div></div>'; }).join('') +
            '</div>' +
            '<h2>' + esc(t('gov.servicesInfo')) + '</h2><div class="tiles">' +
            home.categories.map(function (c) {
                return '<button class="tile" data-go="/browse/' + esc(c.id) + '"><span class="ic">' + esc(c.icon || '') + '</span><b>' + esc(c.title) + '</b><span>' + esc(c.description || '') + '</span></button>';
            }).join('') + '</div>');
        document.getElementById('q').onsubmit = function (e) {
            e.preventDefault();
            var v = document.getElementById('qi').value.trim();
            if (v) Site.go('/search/' + encodeURIComponent(v));
        };
    }

    function pCategory(id) {
        var c = findCat(id);
        if (!c) return pNotFound();
        var list = home.services.filter(function (s) { return s.category === id; });
        setPage(c.title,
            '<h1>' + esc(c.title) + '</h1><p class="lead">' + esc(c.description || '') + '</p>' +
            '<div class="glist">' + (list.length ? list.map(serviceRow).join('') : '<div class="muted">' + esc(t('gov.nothingHere')) + '</div>') + '</div>',
            [{ t: t('gov.home'), go: '/' }, { t: c.title }]);
    }

    function serviceRow(s) {
        var soon = s.status !== 'live';
        return '<div><a class="glink" data-go="' + esc(s.path) + '">' + esc(s.title) + '</a>' +
            '<div class="desc">' + esc(s.description) + (soon ? ' <span class="tag">' + esc(t('gov.notYet')) + '</span>' : '') + '</div></div>';
    }

    function pSearch(q) {
        q = decodeURIComponent(q || '');
        var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
        var hits = home.services.filter(function (s) {
            var hay = (s.title + ' ' + s.description).toLowerCase();
            return terms.every(function (term) { return hay.indexOf(term) !== -1; });
        });
        setPage(t('gov.search'), '<h1>' + esc(t('gov.search.title')) + '</h1><p class="muted">' + esc(hits.length === 1 ? t('gov.search.results.one', hits.length, q) : t('gov.search.results.other', hits.length, q)) + '</p>' +
            '<div class="glist">' + hits.map(serviceRow).join('') + '</div>', [{ t: t('gov.home'), go: '/' }, { t: t('gov.search') }]);
    }

    function pService(id) {
        var s = findService(id);
        if (!s) return pNotFound();
        if (s.status === 'live' && !s.link && s.path && s.path !== '/s/' + s.id) return Site.go(s.path);
        var cat = findCat(s.category);
        var trail = [{ t: t('gov.home'), go: '/' }, cat ? { t: cat.title, go: '/browse/' + cat.id } : { t: t('gov.crumb.services') }, { t: s.title }];
        var body;
        if (s.link) {
            body = '<p class="lead">' + esc(s.description) + '</p><p><button class="gbtn" data-open="' + esc(s.link) + '">' + esc(t('gov.continue')) + '</button></p>' +
                '<p class="fine">' + esc(t('gov.service.willGo', s.link)) + '</p>';
        } else if (s.id === 'book-mot' && !home.mot.enabled) {
            body = '<div class="status warn"><h3>' + esc(t('gov.service.motSoon.title')) + '</h3><p>' + esc(t('gov.service.motSoon.body')) + '</p></div>' +
                '<p><a class="glink" data-go="/vehicle-checker">' + esc(t('gov.checker.title')) + '</a></p>';
        } else {
            body = '<div class="status warn"><h3>' + esc(t('gov.service.soon.title')) + '</h3><p>' + esc(t('gov.service.soon.body')) + '</p></div>';
        }
        setPage(s.title, '<h1>' + esc(s.title) + '</h1>' + body, trail);
    }

    function pNotFound() {
        setPage(t('gov.notFound.title'), '<h1>' + esc(t('gov.notFound.title')) + '</h1><p>' + esc(t('gov.notFound.body')) + '</p><p><a class="glink" data-go="/">' + esc(t('gov.goHome')) + '</a></p>');
    }

    // ------------------------------------------------------------------ vehicle checker

    function pCheckerForm(err, val) {
        setPage(t('gov.checker.title'),
            '<h1>' + esc(t('gov.checker.title')) + '</h1>' +
            '<p class="lead">' + esc(home.mot.enabled ? t('gov.checker.lead.taxMot') : t('gov.checker.lead.tax')) + '</p>' +
            '<form id="f"><label class="field"><span class="lbl">' + esc(t('gov.checker.label')) + '</span>' +
            '<span class="hint">' + esc(t('gov.checker.hint')) + '</span>' +
            '<input type="text" id="p" maxlength="10" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;font-size:24px;font-weight:800;letter-spacing:.06em;max-width:280px;border:2px solid var(--fg);border-radius:0" value="' + esc(val || '') + '">' +
            (err ? '<span class="err">' + esc(err) + '</span>' : '') + '</label>' +
            '<button class="gbtn" type="submit">' + esc(t('gov.continue')) + '</button></form>',
            [{ t: t('gov.home'), go: '/' }, { t: t('gov.crumb.driving'), go: '/browse/driving' }, { t: t('gov.checker.title') }]);
        var f = document.getElementById('f');
        f.onsubmit = function (e) {
            e.preventDefault();
            var k = plateKey(document.getElementById('p').value);
            if (k.length < 2) return pCheckerForm(t('gov.checker.enterPlate'), '');
            Site.go('/vehicle-checker/' + k);
        };
    }

    function taxBlock(v, now) {
        var tx = v.tax;
        var label = '<span class="k">' + esc(t('gov.block.tax')) + '</span>';
        if (tx.status === 'exempt') return '<div class="status good">' + label + '<h3>' + esc(t('gov.block.tax.exempt')) + '</h3><p>' + esc(t('gov.block.tax.exemptText')) + '</p></div>';
        if (tx.status === 'taxed') {
            var left = days(tx.expiry, now);
            return '<div class="status good">' + label + '<h3>' + esc(t('gov.block.tax.taxed')) + '</h3><p>' + t('gov.block.tax.due', Site.date(tx.expiry)) +
                (left <= 7 ? ' <span class="tag warn">' + esc(left === 1 ? t('gov.block.tax.left.one', left) : t('gov.block.tax.left.other', left)) + '</span>' : '') + '</p></div>';
        }
        return '<div class="status bad">' + label + '<h3>' + esc(t('gov.block.tax.untaxed')) + '</h3><p>' + t('gov.block.tax.expired', Site.date(tx.expiry)) + '</p></div>';
    }

    function motBlock(v, now) {
        var m = v.mot;
        var label = '<span class="k">' + esc(t('gov.block.mot')) + '</span>';
        if (!m.enabled) return '<div class="status">' + label + '<h3>' + esc(t('gov.block.mot.notRequired')) + '</h3><p>' + esc(t('gov.block.mot.notRequiredText')) + '</p></div>';
        if (m.status === 'valid') return '<div class="status good">' + label + '<h3>' + esc(t('gov.block.mot.valid')) + '</h3><p>' + t('gov.block.mot.expires', Site.date(m.expiry)) + '</p></div>';
        if (m.status === 'expired') return '<div class="status bad">' + label + '<h3>' + esc(t('gov.block.mot.expired')) + '</h3><p>' + t('gov.block.mot.expiredOn', Site.date(m.expiry)) + '</p></div>';
        if (m.status === 'failed') return '<div class="status bad">' + label + '<h3>' + esc(t('gov.block.mot.noValid')) + '</h3><p>' + esc(t('gov.block.mot.failed')) + '</p></div>';
        return '<div class="status warn">' + label + '<h3>' + esc(t('gov.block.mot.none')) + '</h3><p>' + esc(t('gov.block.mot.noneText')) + '</p></div>';
    }

    function insBlock(v) {
        if (!v.insurance) return '';
        var ok = v.insurance.status === 'insured';
        return '<div class="status ' + (ok ? 'good' : 'bad') + '"><span class="k">' + esc(t('gov.block.insurance')) + '</span><h3>' + esc(ok ? t('gov.block.insurance.yes') : t('gov.block.insurance.no')) + '</h3>' +
            (ok && v.insurance.endsAt ? '<p>' + t('gov.block.insurance.ends', Site.date(v.insurance.endsAt)) + '</p>' : '') + '</div>';
    }

    function historyBlock(v) {
        if (!home.mot.enabled) return '';
        var h = v.motHistory || [];
        if (!h.length) return '<h2>' + esc(t('gov.block.motHistory')) + '</h2><p class="muted">' + esc(t('gov.block.motHistory.none')) + '</p>';
        return '<h2>' + esc(t('gov.block.motHistory')) + '</h2><div class="glist">' + h.map(function (r) {
            return '<div><div class="vrow"><b>' + Site.date(r.testedAt) + '</b><span class="tag ' + (r.passed ? 'good' : 'bad') + '">' + esc(r.passed ? t('gov.pass') : t('gov.fail')) + '</span></div>' +
                (r.details ? '<div class="desc">' + esc(r.details) + '</div>' : '') + '</div>';
        }).join('') + '</div>';
    }

    function pCheckerResult(key) {
        var my = ++token;
        loading();
        Site.call('lookup', { plate: key }).then(function (v) {
            if (my !== token) return;
            var trail = [{ t: t('gov.home'), go: '/' }, { t: t('gov.crumb.driving'), go: '/browse/driving' }, { t: t('gov.checker.title'), go: '/vehicle-checker' }, { t: v.plate || key }];
            if (!v.found) {
                setPage(t('gov.checker.notFound.title'),
                    '<h1>' + esc(t('gov.checker.notFound.h1')) + '</h1><p>' + plateHtml(key) + '</p>' +
                    '<div class="status bad"><h3>' + esc(t('gov.checker.notFound.h3')) + '</h3><p>' + esc(t('gov.checker.notFound.body')) + '</p></div>' +
                    '<p><a class="gbtn" data-go="/vehicle-checker">' + esc(t('gov.checker.tryAnother')) + '</a></p>', trail);
                return;
            }
            setPage(v.plate,
                '<h1>' + esc(t('gov.checker.details')) + '</h1><p>' + plateHtml(v.plate) + '</p>' +
                '<table class="kv"><tr><th>' + esc(t('gov.checker.make')) + '</th><td>' + esc(v.make) + '</td></tr><tr><th>' + esc(t('gov.checker.model')) + '</th><td>' + esc(v.model) + '</td></tr>' +
                '<tr><th>' + esc(t('gov.checker.colour')) + '</th><td>' + esc(v.colour) + '</td></tr><tr><th>' + esc(t('gov.th.type')) + '</th><td>' + esc(v.class) + '</td></tr></table>' +
                taxBlock(v, v.now) + motBlock(v, v.now) + insBlock(v) + historyBlock(v) +
                (v.owned && home.mot.enabled && findService('book-mot') && findService('book-mot').status === 'live' ? '<p style="margin-top:16px"><a class="gbtn" data-go="/book-mot/' + esc(plateKey(v.plate)) + '">' + esc(t('gov.mot.bookThis')) + '</a></p>' : '') +
                (v.owned && v.tax.status !== 'exempt' ? '<p style="margin-top:16px"><a class="gbtn" data-go="/tax-vehicle/' + esc(plateKey(v.plate)) + '">' + esc(t('gov.checker.taxThis')) + '</a></p>' : '') +
                '<p style="margin-top:16px"><a class="glink" data-go="/vehicle-checker">' + esc(t('gov.checker.another')) + '</a></p>', trail);
        }).catch(function (e) { if (my === token) failure(e); });
    }

    // ------------------------------------------------------------------ tax a vehicle

    function TAX_TRAIL() { return [{ t: t('gov.home'), go: '/' }, { t: t('gov.crumb.driving'), go: '/browse/driving' }, { t: t('gov.taxList.title'), go: '/tax-vehicle' }]; }

    function loadGarage() {
        return Site.call('myVehicles').then(function (g) { garage = g; return g; });
    }

    function pTaxList() {
        var my = ++token;
        loading();
        loadGarage().then(function (g) {
            if (my !== token) return;
            var html = '<h1>' + esc(t('gov.taxList.title')) + '</h1><p class="lead">' + esc(t('gov.taxList.lead')) + '</p>';
            if (!g.vehicles.length) {
                html += '<div class="status warn"><h3>' + esc(t('gov.taxList.none.title')) + '</h3><p>' + esc(t('gov.taxList.none.body')) + '</p></div>';
            } else {
                html += g.vehicles.map(function (v) {
                    var ty = v.tax, left = ty.expiry ? days(ty.expiry, g.now) : 0, st;
                    if (ty.status === 'exempt') st = '<span class="tag good">' + esc(t('gov.tag.exempt')) + '</span>';
                    else if (ty.status === 'taxed') st = '<span class="tag good">' + esc(t('gov.tag.taxedUntil', Site.date(ty.expiry))) + '</span>';
                    else st = '<span class="tag bad">' + esc(t('gov.tag.untaxed')) + '</span>';
                    var action = ty.status === 'exempt' ? '' :
                        v.canRenew ? '<button class="gbtn" data-go="/tax-vehicle/' + esc(v.plateKey) + '">' + esc(t('gov.taxList.button', Site.money(ty.rate))) + '</button>' :

            html += '<p style="margin-top:16px"><a class="glink" data-go="/driving-licence">' + esc(t('gov.licence.backTo')) + '</a></p>';

    // ------------------------------------------------------------------ MOT booking

    var MB = null;          // the booking being made: { plate, garage, date, time, change, avail }
    var motCache = null;    // last motState result
    var motReceipt = null;  // { kind: 'book' | 'move' | 'cancel', b, refund }

    function MOT_TRAIL(extra) {
        var base = [{ t: t('gov.home'), go: '/' }, { t: t('gov.crumb.driving'), go: '/browse/driving' }];
        if (extra) return base.concat([{ t: t('gov.mot.title'), go: '/book-mot' }], extra);
        return base.concat([{ t: t('gov.mot.title') }]);
    }
    function loadMot() { return Site.call('motState').then(function (s) { motCache = s; return s; }); }
    function noonTs(d) { var p = String(d).split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0).getTime() / 1000; }
    function dayName(d) {
        var p = String(d).split('-');
        var wd = new Date(+p[0], +p[1] - 1, +p[2], 12, 0, 0).getDay();
        return (t('gov.mot.weekdays').split(',')[wd] || '').trim();
    }
    function dayText(d) { return dayName(d) + ' ' + Site.date(noonTs(d)); }
    function whenText(b) { return dayText(b.date) + ', ' + b.time; }
    function motTag(v) {
        var m = v.mot;
        if (!m || !m.enabled) return '';
        if (m.status === 'valid') return '<span class="tag good">' + esc(t('gov.mot.tag.valid', Site.date(m.expiry))) + '</span>';
        if (m.status === 'expired') return '<span class="tag bad">' + esc(t('gov.mot.tag.expired')) + '</span>';
        if (m.status === 'failed') return '<span class="tag bad">' + esc(t('gov.mot.tag.failed')) + '</span>';
        return '<span class="tag warn">' + esc(t('gov.mot.tag.none')) + '</span>';
    }
    function motBookingCard(b, cfg) {
        var acts = b.canCancel ?
            '<div class="acts"><a class="gbtn grey" data-go="/book-mot/change/' + b.id + '">' + esc(t('gov.mot.change')) + '</a>' +
            '<a class="gbtn grey" data-go="/book-mot/cancel/' + b.id + '">' + esc(t('gov.mot.cancelBooking')) + '</a></div>' :
            '<span class="fine">' + esc(t('gov.mot.locked', cfg.cancelMinutes)) + '</span>';
        return '<div class="veh"><div class="vrow">' + plateHtml(b.plate, true) + '<span class="tag good">' + esc(t('gov.mot.tag.booked')) + '</span></div>' +
            '<div class="meta"><b>' + esc(whenText(b)) + '</b><br>' + esc(b.garageName) + (b.address ? ', ' + esc(b.address) : '') + (b.vehicle ? '<br>' + esc(b.vehicle) : '') + '</div>' + acts + '</div>';
    }

    function pMotList(err) {
        var my = ++token;
        loading();
        Promise.all([loadMot(), loadGarage()]).then(function (r) {
            if (my !== token) return;
            var s = r[0], g = r[1], cfg = s.config;
            var booked = {};
            s.upcoming.forEach(function (b) { booked[plateKey(b.plate)] = true; });
            var html = '<h1>' + esc(t('gov.mot.title')) + '</h1><p class="lead">' + esc(t('gov.mot.lead', cfg.cancelMinutes)) + '</p>' +
                (err ? '<div class="notice bad" style="margin:12px 0">' + esc(err) + '</div>' : '');
            html += '<h2>' + esc(t('gov.mot.yourBookings')) + '</h2>';
            html += s.upcoming.length ? s.upcoming.map(function (b) { return motBookingCard(b, cfg); }).join('') : '<p class="muted">' + esc(t('gov.mot.noBookings')) + '</p>';
            html += '<h2>' + esc(t('gov.mot.yourVehicles')) + '</h2>';
            var cars = g.vehicles.filter(function (v) { return !v.exempt; });
            if (!cars.length) {
                html += '<div class="status warn"><h3>' + esc(t('gov.mot.noVehicles.title')) + '</h3><p>' + esc(t('gov.mot.noVehicles.body')) + '</p></div>';
            } else {
                html += cars.map(function (v) {
                    var has = !!booked[v.plateKey];
                    return '<div class="veh"><div class="vrow">' + plateHtml(v.plate, true) + motTag(v) + '</div>' +
                        '<div class="meta">' + esc(v.colour) + ' ' + esc(v.make) + ' ' + esc(v.model) + '</div>' +
                        (has ? '<span class="fine">' + esc(t('gov.mot.hasBooking')) + '</span>' :
                            '<a class="gbtn" data-go="/book-mot/' + esc(v.plateKey) + '">' + esc(t('gov.mot.book')) + '</a>') + '</div>';
                }).join('');
            }
            if (s.past.length) {
                html += '<h2>' + esc(t('gov.mot.pastBookings')) + '</h2><div class="glist">' + s.past.map(function (b) {
                    var cls = b.status === 'done' ? 'good' : (b.status === 'missed' ? 'bad' : '');
                    return '<div><div class="vrow"><b>' + esc(b.plate) + '</b><span class="tag ' + cls + '">' + esc(t('gov.mot.status.' + b.status)) + '</span></div>' +
                        '<div class="desc">' + esc(whenText(b)) + ' · ' + esc(b.garageName) + '</div></div>';
                }).join('') + '</div>';
            }
            setPage(t('gov.mot.title'), html, MOT_TRAIL());
        }).catch(function (e) { if (my === token) failure(e); });
    }

    // choose a garage, day and time. opts = { plate } for a new booking, { change: id } to move one.
    function pMotPick(opts) {
        var my = ++token;
        loading();
        var needVeh = opts.change ? Promise.resolve(null) : loadGarage();
        Promise.all([loadMot(), needVeh]).then(function (r) {
            if (my !== token) return;
            var s = r[0], cfg = s.config, veh = null, old = null;
            if (opts.change) {
                s.upcoming.forEach(function (b) { if (b.id === opts.change) old = b; });
                if (!old || !old.canCancel) return pMotList(t('gov.mot.err.too_late'));
                MB = { change: old.id, plate: old.plate, garage: old.garage, date: null, time: null, avail: {}, old: old };
            } else {
                r[1].vehicles.forEach(function (v) { if (v.plateKey === opts.plate) veh = v; });
                if (!veh) return pNotFound();
                var already = s.upcoming.some(function (b) { return plateKey(b.plate) === opts.plate; });
                if (already) return pMotList();
                MB = { change: null, plate: veh.plate, garage: cfg.garages[0].id, date: null, time: null, avail: {}, vehicle: veh.colour + ' ' + veh.make + ' ' + veh.model };
            }
            var title = opts.change ? t('gov.mot.change.title') : t('gov.mot.pick.title');
            setPage(title,
                '<h1>' + esc(title) + '</h1><p>' + plateHtml(MB.plate) + '</p>' +
                (opts.change ? '<div class="status"><p style="margin:0">' + esc(t('gov.mot.th.oldTime')) + ': <b>' + esc(whenText(old)) + '</b>, ' + esc(old.garageName) + '</p><p class="fine" style="margin:6px 0 0">' + esc(t('gov.mot.change.note')) + '</p></div>' : '') +
                '<div id="mb-body"></div>',
                MOT_TRAIL([{ t: opts.change ? t('gov.mot.crumb.change') : t('gov.mot.crumb.pick') }]));
            var body = document.getElementById('mb-body');
            body.onclick = function (e) {
                var el = e.target.closest ? e.target.closest('[data-mg],[data-md],[data-ms],#mb-next') : null;
                if (!el || el.disabled) return;
                if (el.getAttribute('data-mg')) { MB.garage = el.getAttribute('data-mg'); MB.date = null; MB.time = null; }
                else if (el.getAttribute('data-md')) { MB.date = el.getAttribute('data-md'); MB.time = null; }
                else if (el.getAttribute('data-ms')) { MB.time = el.getAttribute('data-ms'); }
                else if (el.id === 'mb-next') { return Site.go('/book-mot/confirm'); }
                drawPick(cfg);
            };
            drawPick(cfg);
        }).catch(function (e) { if (my === token) failure(e); });
    }

    function pickDay(av) {
        for (var i = 0; i < av.days.length; i++) if (av.days[i].date === MB.date) return av.days[i];
        return null;
    }
    function drawPick(cfg) {
        var body = document.getElementById('mb-body');
        if (!body || !MB) return;
        var html = '';
        if (cfg.garages.length > 1) {
            html += '<h2>' + esc(t('gov.mot.garage')) + '</h2><div class="opts">' + cfg.garages.map(function (g) {
                return '<button class="opt' + (g.id === MB.garage ? ' on' : '') + '" data-mg="' + esc(g.id) + '">' + esc(g.name) + (g.address ? '<small>' + esc(g.address) + '</small>' : '') + '</button>';
            }).join('') + '</div>';
        } else {
            var g0 = cfg.garages[0];
            html += '<p><b>' + esc(g0.name) + '</b>' + (g0.address ? '<br><span class="fine">' + esc(g0.address) + '</span>' : '') + '</p>';
        }
        var av = MB.avail[MB.garage];
        if (!av) {
            body.innerHTML = html + '<div class="spinner"></div>';
            var gid = MB.garage;
            Site.call('motSlots', { garage: gid }).then(function (res) {
                MB.avail[gid] = res; if (MB && MB.garage === gid) drawPick(cfg);
            }).catch(function (e) { body.innerHTML = '<div class="notice bad">' + esc(e && e.message ? e.message : t('gov.error')) + '</div>'; });
            return;
        }
        if (!MB.date || !pickDay(av)) {
            MB.date = null;
            for (var i = 0; i < av.days.length && !MB.date; i++) {
                if (av.days[i].slots.some(function (x) { return x.free; })) MB.date = av.days[i].date;
            }
            MB.time = null;
        }
        html += '<h2>' + esc(t('gov.mot.day')) + '</h2><div class="opts">' + av.days.map(function (d) {
            var free = d.slots.some(function (x) { return x.free; });
            return '<button class="opt' + (d.date === MB.date ? ' on' : '') + '" data-md="' + esc(d.date) + '"' + (free ? '' : ' disabled') + '>' + esc(dayName(d.date)) + '<small>' + esc(Site.date(noonTs(d.date))) + '</small></button>';
        }).join('') + '</div>';
        var day = MB.date ? pickDay(av) : null;
        if (!day) {
            html += '<p class="muted">' + esc(t('gov.mot.noSlots')) + '</p>';
        } else {
            html += '<h2>' + esc(t('gov.mot.time')) + '</h2><div class="slots">' + day.slots.map(function (x) {
                return '<button class="opt' + (x.time === MB.time ? ' on' : '') + '" data-ms="' + esc(x.time) + '"' + (x.free ? '' : ' disabled') + '>' + esc(x.time) + '</button>';
            }).join('') + '</div>';
        }
        var fee = MB.change ? null : av.garage.fee;
        html += '<p class="fine" style="margin-top:14px">' + esc(MB.change ? t('gov.mot.change.note') : (fee > 0 ? t('gov.mot.th.fee') + ': ' + Site.money(fee) + '. ' + t('gov.bankNote') : t('gov.mot.free'))) + '</p>' +
            '<button class="gbtn block" id="mb-next"' + (MB.time ? '' : ' disabled') + '>' + esc(MB.time ? t('gov.mot.continue') : t('gov.mot.selectSlot')) + '</button>';
        body.innerHTML = html;
    }

    function mbGarage() {
        var g = null;
        if (motCache) motCache.config.garages.forEach(function (x) { if (x.id === MB.garage) g = x; });
        return g;
    }

    function pMotConfirm(err) {
        if (!MB || !MB.time || !motCache) return Site.go('/book-mot');
        ++token;
        var g = mbGarage() || { name: MB.garage }, change = !!MB.change;
        var fee = change ? 0 : (g.fee || 0);
        var btn = change ? t('gov.mot.confirmChange') : (fee > 0 ? t('gov.mot.confirmBook', Site.money(fee)) : t('gov.mot.confirmBookFree'));
        var trail = MOT_TRAIL([{ t: t('gov.crumb.confirm') }]);
        setPage(t('gov.mot.confirm.title'),
            '<h1>' + esc(t('gov.mot.confirm.title')) + '</h1><p>' + plateHtml(MB.plate) + '</p>' +
            (err ? '<div class="notice bad" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
            '<table class="kv">' + (MB.vehicle ? '<tr><th>' + esc(t('gov.th.vehicle')) + '</th><td>' + esc(MB.vehicle) + '</td></tr>' : '') +
            '<tr><th>' + esc(t('gov.mot.th.garage')) + '</th><td>' + esc(g.name) + (g.address ? '<br><span class="fine">' + esc(g.address) + '</span>' : '') + '</td></tr>' +
            (change ? '<tr><th>' + esc(t('gov.mot.th.oldTime')) + '</th><td>' + esc(whenText(MB.old)) + '</td></tr>' : '') +
            '<tr><th>' + esc(change ? t('gov.mot.th.newTime') : t('gov.mot.th.when')) + '</th><td><b>' + esc(dayText(MB.date) + ', ' + MB.time) + '</b></td></tr>' +
            '<tr><th>' + esc(t('gov.mot.th.fee')) + '</th><td><b>' + (change ? esc(t('gov.mot.free')) : (fee > 0 ? Site.money(fee) : esc(t('gov.mot.free')))) + '</b></td></tr></table>' +
            (fee > 0 ? '<p class="fine" style="margin-top:12px">' + esc(t('gov.bankNote')) + '</p>' : '') +
            '<button class="gbtn block" id="mb-pay">' + esc(btn) + '</button>' +
            '<p style="margin-top:12px"><a class="glink" data-go="/book-mot">' + esc(t('gov.cancel')) + '</a></p>', trail);
        document.getElementById('mb-pay').onclick = function () {
            var b = this;
            b.disabled = true; b.textContent = t('gov.processing');
            var call = change ? Site.call('motMove', { id: MB.change, garage: MB.garage, date: MB.date, time: MB.time })
                              : Site.call('motBook', { plate: MB.plate, garage: MB.garage, date: MB.date, time: MB.time });
            call.then(function (res) {
                motReceipt = { kind: change ? 'move' : 'book', b: res };
                motCache = null; garage = null; MB = null;
                Site.go('/book-mot/done');
            }).catch(function (e) {
                if (MB) MB.avail = {};
                pMotConfirm(e && e.message ? e.message : t('gov.error'));
            });
        };
    }

    function pMotDone() {
        if (!motReceipt || motReceipt.kind === 'cancel') return Site.go('/book-mot');
        var r = motReceipt, b = r.b, moved = r.kind === 'move';
        setPage(t(moved ? 'gov.mot.moved.title' : 'gov.mot.done.title'),
            '<div class="receipt"><h1>' + esc(t(moved ? 'gov.mot.moved.title' : 'gov.mot.done.title')) + '</h1><div>' + plateHtml(b.plate) + '</div></div>' +
            '<table class="kv"><tr><th>' + esc(t('gov.mot.th.garage')) + '</th><td>' + esc(b.garageName) + (b.address ? '<br><span class="fine">' + esc(b.address) + '</span>' : '') + '</td></tr>' +
            '<tr><th>' + esc(t('gov.mot.th.when')) + '</th><td><b>' + esc(whenText(b)) + '</b></td></tr>' +
            (!moved ? '<tr><th>' + esc(t('gov.th.amountPaid')) + '</th><td>' + (b.paid > 0 ? Site.money(b.paid) : esc(t('gov.mot.free'))) + '</td></tr>' : '') + '</table>' +
            '<p class="fine" style="margin-top:12px">' + esc(t(moved ? 'gov.mot.moved.note' : 'gov.mot.done.note')) + '</p>' +
            '<p style="margin-top:16px"><a class="glink" data-go="/book-mot">' + esc(t('gov.mot.backTo')) + '</a></p>', MOT_TRAIL([{ t: t('gov.crumb.done') }]));
    }

    function pMotCancel(id, err) {
        var my = ++token;
        loading();
        var have = motCache ? Promise.resolve(motCache) : loadMot();
        have.then(function (s) {
            if (my !== token) return;
            var b = null;
            s.upcoming.forEach(function (x) { if (x.id === id) b = x; });
            if (!b || !b.canCancel) return pMotList(t('gov.mot.err.too_late'));
            setPage(t('gov.mot.cancel.title'),
                '<h1>' + esc(t('gov.mot.cancel.title')) + '</h1><p>' + plateHtml(b.plate) + '</p>' +
                (err ? '<div class="notice bad" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
                '<table class="kv"><tr><th>' + esc(t('gov.mot.th.garage')) + '</th><td>' + esc(b.garageName) + '</td></tr>' +
                '<tr><th>' + esc(t('gov.mot.th.when')) + '</th><td><b>' + esc(whenText(b)) + '</b></td></tr></table>' +
                '<p style="margin-top:12px">' + esc(b.fee > 0 ? t('gov.mot.cancel.refund', Site.money(b.fee)) : t('gov.mot.cancel.refundNone')) + '</p>' +
                '<button class="gbtn block" id="mb-cancel">' + esc(t('gov.mot.cancel.yes')) + '</button>' +
                '<p style="margin-top:12px"><a class="glink" data-go="/book-mot">' + esc(t('gov.mot.cancel.keep')) + '</a></p>', MOT_TRAIL([{ t: t('gov.mot.crumb.cancel') }]));
            document.getElementById('mb-cancel').onclick = function () {
                var btn = this;
                btn.disabled = true; btn.textContent = t('gov.processing');
                Site.call('motCancel', { id: id }).then(function (res) {
                    motReceipt = { kind: 'cancel', b: res.booking, refund: res.refund };
                    motCache = null; garage = null;
                    Site.go('/book-mot/cancelled');
                }).catch(function (e) { pMotCancel(id, e && e.message ? e.message : t('gov.error')); });
            };
        }).catch(function (e) { if (my === token) failure(e); });
    }

    function pMotCancelled() {
        if (!motReceipt || motReceipt.kind !== 'cancel') return Site.go('/book-mot');
        var r = motReceipt;
        setPage(t('gov.mot.cancelled.title'),
            '<div class="receipt"><h1>' + esc(t('gov.mot.cancelled.title')) + '</h1><div>' + plateHtml(r.b.plate) + '</div>' +
            (r.refund > 0 ? '<p style="margin:12px 0 0">' + esc(t('gov.mot.cancelled.refunded', Site.money(r.refund))) + '</p>' : '') + '</div>' +
            '<p style="margin-top:16px"><a class="glink" data-go="/book-mot">' + esc(t('gov.mot.backTo')) + '</a></p>', MOT_TRAIL([{ t: t('gov.crumb.done') }]));
    }

    // ------------------------------------------------------------------ penalty points and fines

    function PEN_TRAIL() { return [{ t: t('gov.home'), go: '/' }, { t: t('gov.crumb.driving'), go: '/browse/driving' }, { t: t('gov.penalties.title') }]; }

            html += st.levels.map(function (l) {
                return '<div class="veh"><div class="vrow"><b>' + esc(l.label) + '</b><b>' + Site.money(l.fee) + '</b></div>' +
                    (l.description ? '<div class="meta">' + esc(l.description) + '</div>' : '') +
                    (pending ? '' : '<a class="gbtn" data-go="/dbs/apply/' + esc(l.id) + '">' + esc(t('gov.dbs.apply')) + '</a>') + '</div>';
            }).join('');
            html += '<p class="fine">' + esc(st.processingMinutes > 0 ? t('gov.dbs.takes', minutesText(st.processingMinutes)) : t('gov.dbs.instant')) +
                (st.validDays > 0 ? ' ' + esc(t('gov.dbs.validFor', st.validDays)) : '') + '</p>';
            html += '<h2>' + esc(t('gov.dbs.employers')) + '</h2><p>' + esc(t('gov.dbs.employersText')) + '</p><p><a class="gbtn grey" data-go="/dbs/verify">' + esc(t('gov.dbs.verifyBtn')) + '</a></p>';
            setPage(t('gov.dbs.title'), html, DBS_TRAIL());
        }).catch(function (e) { if (my === token) failure(e); });
    }

    function pDbsApply(id, err) {
        var my = ++token;
        loading();
        Site.call('dbsState').then(function (st) {
            if (my !== token) return;
            var l = byId(st.levels, id);
            if (!l) return pNotFound();
            setPage(t('gov.confirmPay'),
                '<h1>' + esc(t('gov.confirmPay')) + '</h1><p><b>' + esc(l.label) + '</b></p>' +
                (err ? '<div class="notice bad" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
                '<table class="kv"><tr><th>' + esc(t('gov.th.service')) + '</th><td>' + esc(l.label) + '</td></tr>' +
                (l.description ? '<tr><th>' + esc(t('gov.dbs.th.covers')) + '</th><td>' + esc(l.description) + '</td></tr>' : '') +
                '<tr><th>' + esc(t('gov.th.amountToPay')) + '</th><td><b>' + Site.money(l.fee) + '</b></td></tr></table>' +
                '<p class="fine" style="margin-top:12px">' + esc(t('gov.dbs.applyNote')) + '</p>' +
                '<button class="gbtn block" id="pay">' + esc(t('gov.pay', Site.money(l.fee))) + '</button>' +
                '<p style="margin-top:12px"><a class="glink" data-go="/dbs">' + esc(t('gov.cancel')) + '</a></p>', DBS_TRAIL([{ t: t('gov.crumb.confirm') }]));
            document.getElementById('pay').onclick = function () {
                var btn = this;
                btn.disabled = true; btn.textContent = t('gov.processing');
                Site.call('dbsApply', { level: id }).then(function (r) { dbsReceipt = r; Site.go('/dbs/done'); })
                    .catch(function (e) { pDbsApply(id, e.message); });
            };
        }).catch(function (e) { if (my === token) failure(e); });
    }

    function pDbsDone() {
        if (!dbsReceipt) return Site.go('/dbs');
        var r = dbsReceipt, ready = r.status === 'issued';
        setPage(t('gov.dbs.done.title'),
            '<div class="receipt"><h1>' + esc(ready ? t('gov.dbs.done.ready') : t('gov.dbs.done.title')) + '</h1><p style="margin:0">' + esc(r.levelLabel) + '</p></div>' +
            '<table class="kv"><tr><th>' + esc(t('gov.th.certificateNumber')) + '</th><td>' + esc(r.number) + '</td></tr><tr><th>' + esc(t('gov.th.amountPaid')) + '</th><td>' + Site.money(r.paid) + '</td></tr>' +
            (ready ? '' : '<tr><th>' + esc(t('gov.th.readyBy')) + '</th><td>' + Site.datetime(r.readyAt) + '</td></tr>') + '</table>' +
            '<p class="fine" style="margin-top:12px">' + esc(ready ? t('gov.dbs.done.noteReady') : t('gov.dbs.done.noteWait')) + '</p>' +
            (ready ? '<p style="margin-top:16px"><a class="gbtn" data-go="/dbs/certificate/' + esc(r.number) + '">' + esc(t('gov.dbs.viewCert')) + '</a></p>' : '') +
            '<p style="margin-top:16px"><a class="glink" data-go="/dbs">' + esc(t('gov.dbs.back')) + '</a></p>', DBS_TRAIL([{ t: t('gov.crumb.done') }]));
    }

    function pDbsCert(number) {
        var my = ++token;
        loading();
        Site.call('dbsCertificate', { number: number }).then(function (c) {
            if (my !== token) return;
            var html = '<h1>' + esc(t('gov.dbs.cert.title')) + '</h1>';
            if (c.status !== 'issued') {
                html += '<div class="status warn"><h3>' + esc(t('gov.dbs.pending.title')) + '</h3><p>' + esc(t('gov.dbs.pending.body', c.levelLabel, Site.datetime(c.readyAt))) + '</p></div>';
            } else {
                html += '<div class="paper"><div class="ptitle">' + esc(c.levelLabel) + '</div><div class="pnum">' + esc(c.number) + '</div>' +
                    '<table class="kv"><tr><th>' + esc(t('gov.dbs.th.holder')) + '</th><td>' + esc(c.name) + '</td></tr>' +
                    '<tr><th>' + esc(t('gov.dbs.th.issued')) + '</th><td>' + Site.datetime(c.issuedAt) + '</td></tr>' +
                    (c.expiresAt ? '<tr><th>' + esc(t('gov.dbs.th.validUntil')) + '</th><td>' + Site.date(c.expiresAt) + (c.expired ? ' <span class="tag bad">' + esc(t('gov.dbs.tag.expired')) + '</span>' : '') + '</td></tr>' : '') + '</table>' +
                    '<div class="status ' + (c.result === 'clear' ? 'good' : 'bad') + '"><span class="k">' + esc(t('gov.dbs.th.result')) + '</span><h3>' + esc(t('gov.dbs.result.' + c.result)) + '</h3>' +
                    (c.result === 'clear' ? '<p>' + esc(t('gov.dbs.clearText')) + '</p>' : '') + '</div>';
                if (c.records && c.records.length) {
                    html += '<div class="glist">' + c.records.map(function (r) {
                        return '<div><div class="vrow"><b>' + esc(r.offence) + '</b>' + (r.spent ? '<span class="tag">' + esc(t('gov.dbs.spent')) + '</span>' : '') + '</div>' +
                            '<div class="desc">' + Site.date(r.date) + (r.sentence ? ' · ' + esc(r.sentence) : '') + (r.by ? ' · ' + esc(r.by) : '') + '</div>' +
                            (r.notes ? '<div class="desc">' + esc(t('gov.dbs.policeNote', r.notes)) + '</div>' : '') + '</div>';
                    }).join('') + '</div>';
                }
                html += '</div><p class="fine">' + esc(t('gov.dbs.cert.note')) + '</p>' +
                    '<p><button class="gbtn grey" id="cp">' + esc(t('gov.dbs.copyNumber')) + '</button></p>';
            }
            html += '<p style="margin-top:16px"><a class="glink" data-go="/dbs">' + esc(t('gov.dbs.back')) + '</a></p>';
            setPage(t('gov.dbs.cert.title'), html, DBS_TRAIL([{ t: c.number }]));
            var cp = document.getElementById('cp');
            if (cp) cp.onclick = function () { Site.copy(c.number); cp.textContent = t('gov.dbs.copied'); };
        }).catch(function (e) { if (my === token) failure(e); });
    }

    function pDbsVerify(vals, res, err) {
        vals = vals || {};
        var html = '<h1>' + esc(t('gov.dbs.verify.title')) + '</h1><p class="lead">' + esc(t('gov.dbs.verify.lead')) + '</p>';
        html += '<form id="f"><label class="field"><span class="lbl">' + esc(t('gov.dbs.verify.number')) + '</span>' +
            '<input type="text" id="cn" class="bigin" maxlength="20" autocomplete="off" spellcheck="false" value="' + esc(vals.number || '') + '"></label>' +
            '<label class="field"><span class="lbl">' + esc(t('gov.dbs.verify.surname')) + '</span>' +
            '<input type="text" id="sn" maxlength="40" autocomplete="off" spellcheck="false" value="' + esc(vals.surname || '') + '"></label>' +
            (err ? '<div class="notice bad" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
            '<button class="gbtn" type="submit">' + esc(t('gov.dbs.verify.button')) + '</button></form>';
        if (res) {
            if (!res.valid) {
                html += '<div class="status bad"><h3>' + esc(t('gov.dbs.verify.invalid')) + '</h3><p>' + esc(t('gov.dbs.verify.invalidText')) + '</p></div>';
            } else {
                html += '<div class="status ' + (res.expired ? 'warn' : (res.result === 'clear' ? 'good' : 'bad')) + '"><span class="k">' + esc(t('gov.dbs.verify.genuine')) + '</span><h3>' + esc(res.name) + '</h3>' +
                    '<table class="kv"><tr><th>' + esc(t('gov.dbs.th.level')) + '</th><td>' + esc(res.levelLabel) + '</td></tr>' +
                    '<tr><th>' + esc(t('gov.dbs.th.issued')) + '</th><td>' + Site.date(res.issuedAt) + '</td></tr>' +
                    (res.expiresAt ? '<tr><th>' + esc(t('gov.dbs.th.validUntil')) + '</th><td>' + Site.date(res.expiresAt) + '</td></tr>' : '') +
                    '<tr><th>' + esc(t('gov.dbs.th.result')) + '</th><td><b>' + esc(t('gov.dbs.result.' + res.result)) + '</b></td></tr></table>' +
                    (res.expired ? '<p><b>' + esc(t('gov.dbs.verify.expired')) + '</b></p>' : '') +
                    (res.changed ? '<p><b>' + esc(t('gov.dbs.verify.changed')) + '</b></p>' : '<p>' + esc(t('gov.dbs.verify.unchanged')) + '</p>') + '</div>';
            }
        }
        setPage(t('gov.dbs.verify.title'), html, DBS_TRAIL([{ t: t('gov.dbs.verify.title') }]));
        document.getElementById('f').onsubmit = function (e) {
            e.preventDefault();
            var v = { number: document.getElementById('cn').value, surname: document.getElementById('sn').value };
            if (!v.number.trim() || !v.surname.trim()) return pDbsVerify(v, null, t('gov.dbs.err.verifyInput'));
            Site.call('dbsVerify', v).then(function (r) { pDbsVerify(v, r); }).catch(function (er) { pDbsVerify(v, null, er.message); });
        };
    }

    // ------------------------------------------------------------------ router

    function render(path) {
        if (!home) return;
        var p = path.split('/').filter(Boolean);
        token++;
        var head = p[0] || '';
        if (head === '') return pHome();
        if (head === 'browse') return pCategory(p[1]);
        if (head === 'search') return pSearch(p[1]);
        if (head === 's') return pService(p[1]);
        if (head === 'vehicle-checker') return p[1] ? pCheckerResult(plateKey(p[1])) : pCheckerForm();
        if (head === 'driving-licence') {
            if (p[1] === 'book' && p[2] === 'theory') return pLicenceBook('theory', '');
            if (p[1] === 'book' && p[2] === 'practical' && p[3]) return pLicenceBook('practical', decodeURIComponent(p[3]));
            if (p[1] === 'booked') return pLicenceBooked();
            if (p[1] === 'replace') return pLicenceReplace();
            if (p[1] === 'replaced') return pLicenceReplaced();
            if (p[1] === 'history') return pLicenceHistory();
            return pLicence();
        }
        if (head === 'book-mot') {
            if (!p[1]) return pMotList();
            if (p[1] === 'change' && p[2]) return pMotPick({ change: parseInt(p[2], 10) });
            if (p[1] === 'cancel' && p[2]) return pMotCancel(parseInt(p[2], 10));
            if (p[1] === 'confirm') return pMotConfirm();
            if (p[1] === 'done') return pMotDone();
            if (p[1] === 'cancelled') return pMotCancelled();
            return pMotPick({ plate: plateKey(p[1]) });
        }
        if (head === 'council-tax') {
            if (p[1] === 'pay' && p[2]) return pCouncilPay(decodeURIComponent(p[2]));
            if (p[1] === 'done') return pCouncilDone();
            if (p[1] === 'history') return pCouncilHistory();
            return pCouncil();
        }
        if (head === 'birth-certificate') {
            if (p[1] === 'order') return pBirthcertOrder();
            if (p[1] === 'done') return pBirthcertDone();
            return pBirthcert();
        }
        if (head === 'pay-fine') return pFines();
        if (head === 'benefits') {
            if (p[1] === 'apply') return pBenefitsForm();
            if (p[1] === 'result') return pBenefitsResult();
            benUpdating = false;
            return pBenefits();
        }
        if (head === 'penalties') return pPenalties();
        if (head === 'dbs') {
            if (p[1] === 'apply' && p[2]) return pDbsApply(decodeURIComponent(p[2]));
            if (p[1] === 'done') return pDbsDone();
            if (p[1] === 'certificate' && p[2]) return pDbsCert(decodeURIComponent(p[2]));
            if (p[1] === 'verify') return pDbsVerify();
            return pDbs();
        }
        if (head === 'marriage') return pMarriage();
        if (head === 'register-business') return pBusiness();
        if (head === 'passport') {
            if (p[1] === 'apply' && p[2]) return pPassportApply(decodeURIComponent(p[2]));
            if (p[1] === 'done') return pPassportDone();
            return pPassport();
        }
        if (head === 'tax-vehicle') {
            if (!p[1]) return pTaxList();
            if (p[2] === 'done') return pTaxDone(plateKey(p[1]));
            return pTaxConfirm(plateKey(p[1]));
        }
        pNotFound();
    }

    document.addEventListener('click', function (e) {
        var el = e.target;
        while (el && el !== document.body) {
            if (el.getAttribute) {
                var g = el.getAttribute('data-go');
                if (g) { e.preventDefault(); Site.go(g); return; }
                var o = el.getAttribute('data-open');
                if (o) { e.preventDefault(); Site.open(o); return; }
            }
            el = el.parentNode;
        }
    });

    Site.call('home').then(function (h) {
        home = h;
        document.getElementById('govName').textContent = h.name;
        document.getElementById('foot').innerHTML = '<b>' + esc(h.name) + '</b><br>' + esc(t('gov.roleplayOnly'));
        Site.onRoute(render);
    }).catch(failure);
})();
</script>
</body>
</html>
