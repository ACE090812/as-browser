<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoverCompare</title>
<link rel="stylesheet" href="/sdk/site.css">
<style>
    :root { --accent: #0b5cad; --accent-fg: #fff; --hero-a: #0b3f7d; --hero-b: #1c7be0; }
    :root[data-theme="dark"] { --accent: #5aa2ff; --accent-fg: #06121f; --hero-a: #0c2a52; --hero-b: #16508f; }
    .bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .logo { font-weight: 800; font-size: 19px; letter-spacing: -.02em; cursor: pointer; }
    .logo b { color: var(--accent); }
    .bar nav { display: flex; gap: 6px; }
    .bar nav button { padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; background: var(--surface); }
    .hero { background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); color: #fff; padding: 30px 18px 34px; }
    .hero h1 { font-size: 29px; margin-bottom: 8px; }
    .hero p { opacity: .93; }
    .hero .btn { background: #fff; color: #0b3f7d; }
    .ticks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; margin-top: 14px; opacity: .95; }
    .prov { display: flex; align-items: center; gap: 12px; }
    .pic { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; flex: 0 0 auto; }
    .opts { display: grid; gap: 8px; }
    .opt { display: block; padding: 12px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .opt .t { font-weight: 700; }
    .opt .d { font-size: 13.5px; color: var(--muted); }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button { padding: 10px 14px; border-radius: 10px; border: 2px solid var(--line); font-weight: 600; min-width: 46px; }
    .seg button.on { border-color: var(--accent); background: var(--accent); color: var(--accent-fg); }
    .plate { display: inline-flex; border-radius: 5px; overflow: hidden; border: 2px solid #111; background: #f7d117; }
    .plate .gb { background: #0a3d91; color: #fff; font-size: 8px; font-weight: 800; padding: 3px 4px; display: flex; align-items: flex-end; }
    .plate .reg { color: #111; font-family: "Arial Black", Arial, sans-serif; font-weight: 900; font-size: 18px; letter-spacing: .05em; padding: 2px 9px; }
    .offer { border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--bg); }
    .offer.best { border-color: #16a34a; }
    .offer .price { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    .offer ul { margin: 8px 0 12px; padding-left: 18px; font-size: 14px; }
    .badge { display: inline-block; background: #16a34a; color: #fff; font-size: 11.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .03em; }
    .stars { color: #f59e0b; font-size: 13px; letter-spacing: 1px; }
    .done { text-align: center; padding: 26px 16px; border-radius: var(--radius); background: var(--good-bg); color: var(--good); }
    .done h1 { color: var(--good); }
    .ref { font-family: ui-monospace, Consolas, monospace; font-size: 20px; font-weight: 800; letter-spacing: .06em; }
    .steps { display: flex; gap: 6px; margin-bottom: 16px; }
    .steps i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
    .steps i.on { background: var(--accent); }
    .foot { padding: 20px 16px 30px; text-align: center; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="bar">
    <div class="logo" data-go="/">Cover<b>Compare</b></div>
    <nav><button data-go="/quote" data-i18n="insurance.nav.quote">Quote</button><button data-go="/policies" data-i18n="insurance.nav.policies">Policies</button></nav>
</div>
<div id="app"><div class="spinner"></div></div>
<div class="foot" data-i18n="insurance.foot">CoverCompare · a fictional comparison site for roleplay</div>

<script src="/sdk/site.js"></script>
<script>
(function () {
    var esc = Site.esc, money = Site.money;
    var app = document.getElementById('app');
    var home = null, garage = null;
    var token = 0, keep = false;
    var ans = { plate: '', cover: 'comprehensive', usage: 'social', ncd: 0, days: 7, addons: [] };
    var offers = null;      // last quote { plate, make, ..., offers }
    var done = null;        // last purchase receipt

    function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
    function plateHtml(p) { return '<span class="plate"><span class="gb">GB</span><span class="reg">' + esc(p) + '</span></span>'; }
    function wrap(inner) { return '<div class="wrap">' + inner + '</div>'; }
    function loading() { app.innerHTML = '<div class="spinner"></div>'; }
    function setPage(title, html) { Site.title(title + ' – CoverCompare'); var y = window.scrollY; app.innerHTML = html; window.scrollTo(0, keep ? y : 0); keep = false; }
    function redraw() { keep = true; pForm(); }
    function failure(e) { app.innerHTML = wrap('<div class="notice bad">' + esc(e && e.message ? e.message : t('insurance.error')) + '</div><p style="margin-top:14px"><button class="btn ghost" data-go="/">' + esc(t('insurance.backToStart')) + '</button></p>'); }
    function stars(r) { var n = Math.round(r); return '<span class="stars">' + '★★★★★'.slice(0, n) + '<span style="opacity:.3">' + '★★★★★'.slice(n) + '</span></span> ' + r.toFixed(1); }
    function steps(n) { return '<div class="steps">' + [1, 2, 3].map(function (i) { return '<i class="' + (i <= n ? 'on' : '') + '"></i>'; }).join('') + '</div>'; }
    function loadGarage() { return Site.call('myVehicles').then(function (g) { garage = g; return g; }); }

    // ---------------------------------------------------------------- home

    function pHome() {
        setPage(t('insurance.homeTitle'),
            '<div class="hero"><h1>' + esc(t('insurance.hero.title')) + '</h1><p>' + esc(t('insurance.hero.sub', home.providers.length)) + '</p>' +
            '<button class="btn" data-go="/quote">' + esc(t('insurance.getQuote')) + '</button>' +
            '<div class="ticks"><span>' + esc(t('insurance.tick.free')) + '</span><span>' + esc(t('insurance.tick.certificate')) + '</span><span>' + esc(t('insurance.tick.bank')) + '</span></div></div>' +
            wrap('<h2>' + esc(t('insurance.ourInsurers')) + '</h2><div class="stack">' + home.providers.map(function (p) {
                return '<div class="card prov"><div class="pic" style="background:' + esc(p.color) + '">' + esc(p.icon) + '</div><div class="grow"><b>' + esc(p.name) + '</b><div class="muted small">' + esc(p.blurb) + '</div>' + stars(p.rating) + '</div></div>';
            }).join('') + '</div>' +
            '<p style="margin-top:18px"><button class="btn ghost block" data-go="/policies">' + esc(t('insurance.seePolicies')) + '</button></p>'));
    }

    // ---------------------------------------------------------------- quote form

    function opts(name, list, current) {
        return '<div class="opts">' + list.map(function (o) {
            return '<label class="opt' + (o.id === current ? ' on' : '') + '" data-pick="' + name + '" data-id="' + esc(o.id) + '"><input type="radio" name="' + name + '"><div class="t">' + esc(o.label) + '</div>' +
                (o.description ? '<div class="d">' + esc(o.description) + '</div>' : '') + '</label>';
        }).join('') + '</div>';
    }

    function pForm(err) {
        var my = ++token;
        var draw = function (g) {
            if (my !== token) return;
            if (!g.vehicles.length) {
                setPage(t('insurance.getQuote'), wrap('<h1>' + esc(t('insurance.getQuote')) + '</h1><div class="notice">' + esc(t('insurance.needVehicle')) + '</div>'));
                return;
            }
            if (!ans.plate || !g.vehicles.some(function (v) { return v.plateKey === ans.plate; })) ans.plate = g.vehicles[0].plateKey;
            var vehicles = g.vehicles.map(function (v) {
                return '<label class="opt' + (v.plateKey === ans.plate ? ' on' : '') + '" data-pick="plate" data-id="' + esc(v.plateKey) + '"><input type="radio" name="plate"><div class="row between">' + plateHtml(v.plate) +
                    (v.insuredUntil ? '<span class="tag good">' + esc(t('insurance.insuredUntil', Site.date(v.insuredUntil))) + '</span>' : '<span class="tag bad">' + esc(t('insurance.notInsured')) + '</span>') + '</div><div class="d" style="margin-top:6px">' + esc(v.colour) + ' ' + esc(v.make) + ' ' + esc(v.model) + '</div></label>';
            }).join('');
            var ncd = []; for (var i = 0; i <= home.ncd.maxYears; i++) ncd.push('<button type="button" data-ncd="' + i + '" class="' + (ans.ncd === i ? 'on' : '') + '">' + i + (i === home.ncd.maxYears ? '+' : '') + '</button>');
            setPage(t('insurance.getQuote'), wrap(steps(1) + '<h1>' + esc(t('insurance.getQuote')) + '</h1>' +
                (err ? '<div class="notice bad" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
                '<div class="field"><span class="lbl">' + esc(t('insurance.q.vehicle')) + '</span><div class="opts">' + vehicles + '</div></div>' +
                '<div class="field"><span class="lbl">' + esc(t('insurance.q.cover')) + '</span>' + opts('cover', home.covers, ans.cover) + '</div>' +
                '<div class="field"><span class="lbl">' + esc(t('insurance.q.usage')) + '</span>' + opts('usage', home.usages, ans.usage) + '</div>' +
                '<div class="field"><span class="lbl">' + esc(t('insurance.q.ncd')) + '</span><div class="seg">' + ncd.join('') + '</div></div>' +
                '<div class="field"><span class="lbl">' + esc(t('insurance.q.duration')) + '</span><div class="seg">' + home.durations.map(function (d) {
                    return '<button type="button" data-days="' + d.days + '" class="' + (ans.days === d.days ? 'on' : '') + '">' + esc(d.label) + '</button>';
                }).join('') + '</div></div>' +
                '<div class="field"><span class="lbl">' + esc(t('insurance.q.extras')) + '</span><div class="opts">' + home.addons.map(function (a) {
                    var on = ans.addons.indexOf(a.id) !== -1;
                    return '<label class="opt' + (on ? ' on' : '') + '" data-addon="' + esc(a.id) + '"><input type="checkbox"><div class="row between"><div class="t">' + esc(a.label) + '</div><div class="muted small">' + esc(t('insurance.addonFrom', money(a.price))) + '</div></div><div class="d">' + esc(a.description) + '</div></label>';
                }).join('') + '</div></div>' +
                '<button class="btn block" id="go">' + esc(t('insurance.compare')) + '</button>'));
            document.getElementById('go').onclick = function () { getQuotes(this); };
        };
        if (garage) draw(garage); else { loading(); loadGarage().then(draw).catch(function (e) { if (my === token) failure(e); }); }
    }

    function getQuotes(btn) {
        btn.disabled = true; btn.textContent = t('insurance.comparing');
        Site.call('quote', ans).then(function (q) { offers = q; Site.go('/results'); })
            .catch(function (e) { pForm(e.message); });
    }

    // ---------------------------------------------------------------- results

    function pResults() {
        if (!offers) return Site.go('/quote');
        var q = offers, cover = byId(home.covers, ans.cover), dur = byId(home.durations.map(function (d) { return { id: d.days, label: d.label }; }), ans.days);
        setPage(t('insurance.yourQuotes'), wrap(steps(2) + '<h1>' + esc(t('insurance.yourQuotes')) + '</h1><div class="card row between" style="margin-bottom:14px"><div>' + plateHtml(q.plate) +
            '<div class="muted small" style="margin-top:4px">' + esc(cover ? cover.label : '') + ' · ' + esc(dur ? dur.label : '') + '</div></div><button class="btn ghost" data-go="/quote" style="min-height:36px;padding:0 14px">' + esc(t('insurance.edit')) + '</button></div>' +
            '<div class="stack">' + q.offers.map(function (o, i) {
                var feats = (o.features || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('');
                return '<div class="offer' + (i === 0 ? ' best' : '') + '">' + (i === 0 ? '<span class="badge">' + esc(t('insurance.cheapest')) + '</span>' : '') +
                    '<div class="prov"><div class="pic" style="background:' + esc(o.color) + '">' + esc(o.icon) + '</div><div class="grow"><b>' + esc(o.name) + '</b><div>' + stars(o.rating) + '</div></div>' +
                    '<div style="text-align:right"><div class="price">' + money(o.price) + '</div><div class="muted small">' + esc(t('insurance.perWeek', money(o.perWeek))) + '</div></div></div>' +
                    '<ul><li>' + esc(t('insurance.excessLine', money(o.excess))) + '</li>' + feats + '</ul>' +
                    '<button class="btn block" data-buy="' + esc(o.id) + '">' + esc(t('insurance.buyNow')) + '</button></div>';
            }).join('') + '</div>'));
    }

    // ---------------------------------------------------------------- confirm + purchase

    function pConfirm(id, err) {
        if (!offers) return Site.go('/quote');
        var o = null; offers.offers.forEach(function (x) { if (x.id === id) o = x; });
        if (!o) return Site.go('/results');
        var cover = byId(home.covers, ans.cover), usage = byId(home.usages, ans.usage);
        var dur = null; home.durations.forEach(function (d) { if (d.days === ans.days) dur = d; });
        var extras = ans.addons.map(function (a) { var x = byId(home.addons, a); return x ? (o.included.indexOf(a) !== -1 ? t('insurance.included', x.label) : x.label) : ''; }).join(', ') || t('insurance.none');
        setPage(t('insurance.confirmPay'), wrap(steps(3) + '<h1>' + esc(t('insurance.confirmPay')) + '</h1>' +
            (err ? '<div class="notice bad" style="margin-bottom:12px">' + esc(err) + '</div>' : '') +
            '<div class="card"><table class="kv"><tr><th>' + esc(t('insurance.th.insurer')) + '</th><td>' + esc(o.name) + '</td></tr><tr><th>' + esc(t('insurance.th.vehicle')) + '</th><td>' + plateHtml(offers.plate) + '</td></tr>' +
            '<tr><th>' + esc(t('insurance.th.cover')) + '</th><td>' + esc(cover.label) + '</td></tr><tr><th>' + esc(t('insurance.th.use')) + '</th><td>' + esc(usage.label) + '</td></tr>' +
            '<tr><th>' + esc(t('insurance.th.length')) + '</th><td>' + esc(dur.label) + '</td></tr><tr><th>' + esc(t('insurance.th.extras')) + '</th><td>' + esc(extras) + '</td></tr>' +
            '<tr><th>' + esc(t('insurance.th.excess')) + '</th><td>' + money(o.excess) + '</td></tr><tr><th>' + esc(t('insurance.th.total')) + '</th><td><b style="font-size:20px">' + money(o.price) + '</b></td></tr></table></div>' +
            '<p class="muted small" style="margin-top:12px">' + esc(t('insurance.payNote')) + '</p>' +
            '<button class="btn block" id="pay">' + esc(t('insurance.pay', money(o.price))) + '</button>' +
            '<p style="margin-top:10px"><button class="btn ghost block" data-go="/results">' + esc(t('insurance.backToQuotes')) + '</button></p>'));
        document.getElementById('pay').onclick = function () {
            var b = this; b.disabled = true; b.textContent = t('insurance.processing');
            var body = {}; Object.keys(ans).forEach(function (k) { body[k] = ans[k]; }); body.provider = id;
            Site.call('buy', body).then(function (r) { done = r; garage = null; offers = null; Site.go('/done'); })
                .catch(function (e) { garage = null; pConfirm(id, e.message); });
        };
    }

    function pDone() {
        if (!done) return Site.go('/policies');
        var r = done;
        setPage(t('insurance.coveredTitle'), wrap('<div class="done"><h1>' + esc(t('insurance.covered')) + '</h1><div>' + plateHtml(r.plate) + '</div><p style="margin:12px 0 4px">' + esc(t('insurance.policyRef')) + '</p><div class="ref">' + esc(r.ref) + '</div></div>' +
            '<div class="card" style="margin-top:14px"><table class="kv"><tr><th>' + esc(t('insurance.th.insurer')) + '</th><td>' + esc(r.provider) + '</td></tr><tr><th>' + esc(t('insurance.th.cover')) + '</th><td>' + esc(r.cover) + '</td></tr>' +
            '<tr><th>' + esc(t('insurance.th.starts')) + '</th><td>' + Site.datetime(r.startsAt) + '</td></tr><tr><th>' + esc(t('insurance.th.ends')) + '</th><td>' + Site.datetime(r.endsAt) + '</td></tr><tr><th>' + esc(t('insurance.th.paid')) + '</th><td>' + money(r.price) + '</td></tr></table></div>' +
            '<p class="muted small" style="margin-top:12px">' + esc(t('insurance.doneNote')) + '</p>' +
            '<button class="btn block" data-go="/policies">' + esc(t('insurance.viewPolicies')) + '</button>'));
    }

    // ---------------------------------------------------------------- policies

    function pPolicies() {
        var my = ++token; loading();
        Site.call('policies').then(function (r) {
            if (my !== token) return;
            var list = r.policies;
            setPage(t('insurance.myPolicies'), wrap('<h1>' + esc(t('insurance.myPolicies')) + '</h1>' + (list.length ? '<div class="stack">' + list.map(function (p) {
                var tag = p.active ? '<span class="tag good">' + esc(t('insurance.active')) + '</span>' : p.upcoming ? '<span class="tag warn">' + esc(t('insurance.startsOn', Site.date(p.startsAt))) + '</span>' : '<span class="tag">' + esc(t('insurance.expired')) + '</span>';
                return '<div class="card"><div class="row between">' + plateHtml(p.plate) + tag + '</div><div style="margin-top:8px"><b>' + esc(p.provider) + '</b> · ' + esc(p.cover) + '</div>' +
                    '<div class="muted small">' + esc(t('insurance.dateRange', Site.date(p.startsAt), Site.date(p.endsAt))) + ' · ' + money(p.price) + ' · ' + esc(p.ref) + '</div></div>';
            }).join('') + '</div>' : '<div class="card muted">' + esc(t('insurance.noPolicies')) + '</div>') +
            '<p style="margin-top:16px"><button class="btn block" data-go="/quote">' + esc(t('insurance.getQuote')) + '</button></p>'));
        }).catch(function (e) { if (my === token) failure(e); });
    }

    // ---------------------------------------------------------------- router + events

    function render(path) {
        if (!home) return;
        var p = path.split('/').filter(Boolean);
        token++;
        var h = p[0] || '';
        if (h === '') return pHome();
        if (h === 'quote') return pForm();
        if (h === 'results') return pResults();
        if (h === 'buy') return pConfirm(p[1]);
        if (h === 'done') return pDone();
        if (h === 'policies') return pPolicies();
        pHome();
    }

    document.addEventListener('click', function (e) {
        var el = e.target;
        while (el && el !== document.body) {
            if (el.getAttribute) {
                var g = el.getAttribute('data-go'); if (g) { e.preventDefault(); return Site.go(g); }
                var b = el.getAttribute('data-buy'); if (b) { e.preventDefault(); return Site.go('/buy/' + b); }
                var n = el.getAttribute('data-ncd'); if (n !== null) { ans.ncd = parseInt(n, 10); return redraw(); }
                var d = el.getAttribute('data-days'); if (d !== null) { ans.days = parseInt(d, 10); return redraw(); }
                var pick = el.getAttribute('data-pick');
                if (pick) { e.preventDefault(); ans[pick] = el.getAttribute('data-id'); return redraw(); }
                var ad = el.getAttribute('data-addon');
                if (ad) {
                    e.preventDefault();
                    var i = ans.addons.indexOf(ad);
                    if (i === -1) ans.addons.push(ad); else ans.addons.splice(i, 1);
                    return redraw();
                }
            }
            el = el.parentNode;
        }
    });

    Site.call('home').then(function (h) { home = h; Site.onRoute(render); }).catch(failure);
})();
</script>
</body>
</html>
